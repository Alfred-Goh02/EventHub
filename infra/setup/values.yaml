# EVENTHUB'S ONE-SHOT SETUP, AS A JOB, ON EKS.
#
# COMPOSE'S OWN COMMAND, NOT A COPY. The migrations, the seed, the contact cards, the topics,
# the schemas, the search index and ClickHouse's migrations are what compose's `setup`
# service runs, in docker-compose.yml. infra/eks/up.mjs reads that command from
# `docker compose config` and hands it to this chart, so there is one list of setup steps
# and it cannot fall behind. Nothing here names a step. The chart refuses to render without
# a command or an image, so nothing else can run in its place.
#
# THE KEY DIRECTORIES ARE WRITABLE COPIES. Compose's setup keeps an existing keypair and, on
# every run, copies public halves between the key directories (Notification's into Auth's;
# Auth's into the public-keys volume). Kubernetes mounts a Secret read-only, so each
# directory setup writes to is an emptyDir, and the two that hold keys are seeded from the
# Secrets first, by an init container. Setup finds the keys present, keeps them, and its
# copies land in the emptyDirs and go with the pod. The keys themselves are the Secrets:
# made once, by infra/eks/up.mjs, and never regenerated by a Job -- a new keypair would
# invalidate every token already issued. Which Secret seeds which directory is compose's
# own answer: the named volume compose mounts there carries the Secret's name.

# yaml for kubectl and Helm; json for the verifier (templates/_helpers.tpl).
render: yaml

# Both set by infra/eks/up.mjs: the image in ECR, by git SHA, and compose's setup command.
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
command: []

# Compose's resolved environment for setup, as a Secret infra/eks/up.mjs makes from it.
envSecret: setup-env

# Every directory compose's setup mounts a volume at, by that volume's name. A name that is
# also a Secret's (jwt-keys, notification-keys) is seeded from it; the rest start empty.
workDirs:
  - volume: jwt-keys
    path: /app/services/auth/keys
  - volume: jwt-public
    path: /app/public-keys
  - volume: notification-keys
    path: /app/services/notification/keys
seedFrom: [jwt-keys, notification-keys]

# Measured nowhere yet on EKS; compose sets no limit. Six Prisma migrations and pnpm, one
# at a time.
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { memory: 1536Mi }

# Compose's `restart: "no"`, in Kubernetes: one attempt, and a failure stays failed for a
# person to read, instead of retrying a bad migration forever.
backoffLimit: 0
activeDeadlineSeconds: 1800
