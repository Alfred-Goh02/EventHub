# The local cluster: one control plane and two workers, shaped like the real one.
#
# Two workers rather than one, so topology spread and PodDisruptionBudgets have
# somewhere to spread to: a single-node cluster hides every scheduling problem.
#
# The data stores are NOT in here. Postgres, Kafka, Redis and the rest keep running
# in compose, as RDS, MSK and ElastiCache will sit outside EKS; infra/local/up.mjs
# joins each store to kind's network -- never these nodes to compose's -- and gives
# each one an ExternalName Service naming its container, so a pod reaches
# `postgres:5432` here as it will reach the RDS endpoint there.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: eventhub
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # The ingress controller's ports, on this machine's loopback only: the same rule
    # compose follows (scripts/verify-compose-gateway.mjs), so nothing on the LAN
    # reaches the cluster.
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
