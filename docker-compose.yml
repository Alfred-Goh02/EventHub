# What every application container shares.
#
# Defined here rather than repeated for every service, and defined ABOVE services
# because a YAML anchor has to exist before it is referenced.
#
# ONE IMAGE, MANY COMMANDS. Every application container and setup name the same
# `image:` and the same `build:`, so compose builds it once and the rest reuse it.
# Give them different image names and you get one build of the same lockfile per
# service.
x-app: &app
  image: eventhub/app:local
  build:
    context: .
  restart: unless-stopped
  # Time after SIGTERM to leave consumer groups and close connections before Docker
  # kills the process. Set rather than left to a default: every container on the
  # machine this was written on had been created with a one-second stop timeout, so
  # Notification was killed mid-disconnect (exit 137), and its consumers stayed in
  # their groups until the 30 s session timeout.
  stop_grace_period: 15s
  environment: &app-env
    NODE_ENV: development
    LOG_LEVEL: info
    # Inside the network the broker is kafka:29092, not localhost:9092. See the
    # long note on KAFKA_ADVERTISED_LISTENERS below: the host port exists for
    # tools running on Windows, and a container that used it would fetch metadata
    # and then fail to resolve a name that means nothing here.
    KAFKA_BROKERS: kafka:29092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    JWT_ISSUER: https://auth.eventhub.local
    JWT_AUDIENCE: eventhub-api

# EVERY SERVICE SETS stop_grace_period. None is left to the default, because the
# default is not the documented 10 s everywhere: Docker Desktop before 4.81 stores
# StopTimeout=1 on any container created without one (moby/moby#52775). On the
# machine this was written on, `docker compose stop` gave Kafka, Postgres,
# ClickHouse and OpenSearch one second after SIGTERM, and Kafka's next start
# logged "Recovering 87 logs ... since no clean shutdown file was found".
#
# A ceiling, not a wait: a service that exits in two seconds still takes two.
#
# CHANGING ONE RECREATES THE CONTAINER, and `up` stops the old one with the OLD
# timeout unless given another. Pass the new ceiling:
#   docker compose up -d --timeout 60
#
# Quitting Docker Desktop or shutting Windows down can still cut a stop short
# (docker/desktop-feedback#494). Stop the stack first when that matters.
# scripts/verify-stop-grace-periods.mjs requires a value on every service.
services:
  postgres:
    image: postgres:16
    container_name: eventhub-postgres
    restart: unless-stopped
    # The image stops with SIGINT, a fast shutdown: it ends sessions and writes a
    # shutdown checkpoint, which is what spares the next start a WAL replay.
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub
      # The admin database only. Service databases are created by the bootstrap
      # script below, each owned by its own non-superuser role.
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs ONLY on an empty data directory. To re-run it after changing the
      # bootstrap: docker compose down -v && docker compose up -d
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis, as the cross-pod fan-out bus for the Live service.
  #
  # A WebSocket is pinned to one process for its whole life — pod B cannot write
  # to a file descriptor owned by pod A. So a question posted by a client on one
  # Live pod reaches clients on the others by being PUBLISHed to a channel every
  # pod subscribes to. Kafka cannot do this job: consumer groups load-balance
  # partitions across members, which is the opposite of broadcast.
  #
  # NO PERSISTENCE, DELIBERATELY. Pub/Sub is at-most-once and writes nothing to
  # disk — `PUBLISH` to a channel with no subscribers returns 0 and the message
  # is simply gone. An appendonly file here would create a false impression of
  # durability for a bus that has none. The durable copy of every interaction is
  # in Postgres, and the replayable copy is on Kafka's live.interactions topic.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: eventhub-redis
    restart: unless-stopped
    # Nothing to write on the way down, with persistence off.
    stop_grace_period: 10s
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # OpenSearch, as the Search service's read model.
  #
  # Postgres stays the write model — normalised, constrained, transactional.
  # OpenSearch is DERIVED: flat, denormalised, and indexed for one job, which is
  # finding events by text and returning facet counts fast enough for a filter
  # sidebar to feel instant. Nothing writes to both in one transaction, because
  # no such transaction exists; the index is fed from Kafka and is rebuildable by
  # definition. That is CQRS, and its price is that the index is eventually
  # consistent — there is a window where Postgres knows something it does not.
  #
  # SECURITY PLUGIN OFF, LOCALLY ONLY. It would mean TLS and credential setup in
  # every step of this chapter, and the production path is SigV4 against an
  # in-VPC domain — a completely different mechanism — so the local config would
  # be throwaway work either way.
  #
  # Lucene memory-maps its segment files, so vm.max_map_count should be at least
  # 262144 in the Docker VM. With discovery.type=single-node that is NOT enforced
  # at startup: bootstrap checks are skipped, a low value only logs a warning, the
  # healthcheck passes, and the failure arrives much later as `Map failed` once
  # enough segments exist — so a mmap error days in means this, not the data. On
  # Windows:
  #   wsl -d docker-desktop -e sh -c "sysctl -w vm.max_map_count=262144"
  # ---------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: eventhub-opensearch
    restart: unless-stopped
    # Closes its shards on the way down. Killed first, the next start recovers each
    # one from its translog.
    stop_grace_period: 60s
    environment:
      - cluster.name=eventhub-local
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Small on purpose: this is a laptop and a CI runner, not a cluster.
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      # Refuse to INVENT an index whose name belongs to this application.
      #
      # The default is true, and on it the rule "the index comes from
      # index-definition.ts, never from the first write" was a comment rather
      # than a property. A document written to events-write before bootstrap
      # ran would create an INDEX named events-write with a guessed mapping —
      # tenantId as analysed text — and bootstrap could then never point an
      # alias of that name anywhere, because an index already holds it.
      #
      # Denies events-* and tenant-*, allows everything else, first match wins.
      # Everything else matters: OpenSearch's own plugins create indices such as
      # top_queries-* and .opensearch-observability, and a bare `false` would
      # break them. Measured on this cluster: a write to events-probe returns
      # 404 "[action.auto_create_index] contains [-events-*] which forbids
      # automatic creation", while writes through the real events-write alias
      # still land.
      - "action.auto_create_index=-events-*,-tenant-*,+*"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      # yellow is the healthy answer for a single node: the index asks for zero
      # replicas locally, but the cluster still reports yellow while any
      # system index wants one. Requiring green here would never pass.
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------------------
  # OpenSearch Dashboards, for looking at the engine by hand — _analyze to see a
  # token stream, _explain to see why one hit outranks another.
  #
  # BEHIND A PROFILE, so the ordinary `docker compose up` does not pay for it.
  # It is a development tool, nothing depends on it, and it is another JVM.
  #   docker compose --profile tools up -d opensearch-dashboards
  # ---------------------------------------------------------------------------
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.0
    container_name: eventhub-dashboards
    restart: unless-stopped
    # Keeps no state of its own; its saved objects live in OpenSearch.
    stop_grace_period: 10s
    profiles: ["tools"]
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # ClickHouse: the column store behind Analytics.
  #
  # PINNED to an LTS line, never :latest. MergeTree defaults, async_insert
  # behaviour and deduplication settings have moved between releases, and a
  # study environment whose defaults change underneath it is not reproducible.
  #
  # Only the HTTP interface is published. The Node client speaks HTTP on 8123;
  # the native port 9000 collides with MinIO, Portainer and some VPN clients on
  # Windows, and the CLI is reachable through `docker exec` without it.
  #
  # CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT lets the admin user run CREATE USER and
  # GRANT. Without it the users in db/clickhouse-init are never created, and the
  # failure is a permission error that does not say why.
  #
  # nofile is raised because ClickHouse holds a file handle per column per part;
  # Docker's default produces "Too many open files" under merge load, which looks
  # like corruption and is not.
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: eventhub-clickhouse
    restart: unless-stopped
    # Waits up to shutdown_wait_unfinished (5 s on this image, read from
    # system.server_settings) for running queries before it closes its tables.
    stop_grace_period: 30s
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: eventhub
      CLICKHOUSE_PASSWORD: eventhub
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./db/clickhouse-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user eventhub --password eventhub --query 'SELECT 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Kafka in KRaft mode — one process that is both broker and controller, with
  # no ZooKeeper. ZooKeeper was removed from Kafka in 4.0; every tutorial older
  # than about 2024 still shows a second container for it, and you do not need it.
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: eventhub-kafka
    restart: unless-stopped
    # Closes every partition log and writes the clean shutdown file last. Killed a
    # second in, it had got as far as "LogManager: Shutting down".
    stop_grace_period: 60s
    ports:
      # Only the host listener is published. Containers use kafka:29092 instead.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # THE PART EVERYONE GETS WRONG.
      #
      # A Kafka client does not keep talking to the address it first dialled. It
      # asks the broker for metadata, and the broker replies with its ADVERTISED
      # address — which the client then connects to for all real work.
      #
      # So one address cannot serve both audiences. A container reaching
      # kafka:29092 must be told "kafka:29092"; a process on Windows reaching
      # localhost:9092 must be told "localhost:9092". Advertise only the internal
      # name and your host tools connect, fetch metadata, then fail trying to
      # resolve a hostname that means nothing outside the Docker network.
      #
      # Hence two listeners with two advertised addresses.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      # Single broker, so nothing can be replicated anywhere. These default to 3
      # and the broker refuses to create its internal topics without them.
      # Production would be 3 with min.insync.replicas=2.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Do not wait for other consumers to join before rebalancing. Saves three
      # seconds on every local start; must not be 0 in production.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # KRaft needs a cluster id at format time. Fixed here so a rebuilt volume
      # produces the same cluster rather than a random one.
      CLUSTER_ID: EventHubLocalCluster1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Confluent Schema Registry. Holds the Avro schemas and enforces compatibility
  # at REGISTRATION time — an incompatible producer is rejected before it can
  # publish a message that breaks four consumers at 3am.
  #
  # It stores schemas in a Kafka topic (_schemas), so it needs the broker, not a
  # database of its own. It works against KRaft Kafka; it never needed ZooKeeper.
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: eventhub-schema-registry
    restart: unless-stopped
    # Its schemas live in Kafka. Long enough to leave its group rather than be timed
    # out of it.
    stop_grace_period: 15s
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      # The INTERNAL listener: this container talks to Kafka over the Docker network.
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # BACKWARD: a new schema must be able to read data written by the previous
      # one, so consumers can be upgraded before producers. Adding an optional
      # field is fine; removing a required one is rejected at registration.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Mailpit: the local email inbox. Accepts any SMTP message on 1025 and shows it,
  # rendered, at http://localhost:8025, with no provider account and no sandbox
  # limits. Notification sends here in compose. Pinned, like every other image.
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: eventhub-mailpit
    restart: unless-stopped
    # A local inbox with nothing that depends on it surviving a restart.
    stop_grace_period: 10s
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Everything that has to happen once before any service can serve a request.
  #
  # This exists because "docker compose up" was previously only half of a start.
  # The infrastructure came up and then a reader had to run seven commands by
  # hand -- three migrations, a seed, the topics, the schemas, and a keypair --
  # none of which fail loudly when skipped. A missing topic surfaces as
  # "This server does not host this topic-partition" from the relay's first
  # publish, which names neither the topic nor the thing that would create it.
  #
  # IT RUNS TO COMPLETION AND EXITS, and the services below wait on
  # service_completed_successfully. So a failed migration stops the start instead
  # of producing four containers that are up and broken. `restart: "no"` because
  # a setup step that restarts forever on a bad migration is a hang, not a retry.
  # ---------------------------------------------------------------------------
  setup:
    <<: *app
    container_name: eventhub-setup
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      <<: *app-env
      OPENSEARCH_NODE: http://opensearch:9200
      # Analytics migrations run as the migrator, which only setup holds.
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATOR_USER: analytics_migrator
      CLICKHOUSE_MIGRATOR_PASSWORD: analytics_migrator
      # One per service, because `prisma migrate deploy` reads DATABASE_URL and
      # each service owns a different database. They are passed under distinct
      # names and assigned per command below, rather than hoping three migrations
      # can share one variable.
      AUTH_DATABASE_URL: postgresql://eventhub_auth_owner:eventhub_auth_owner@postgres:5432/eventhub_auth
      # Auth's app role, for queueing contact cards: that command writes the way the
      # service does, one tenant at a time under row security, not as the owner.
      AUTH_APP_DATABASE_URL: postgresql://eventhub_auth_app:eventhub_auth_app@postgres:5432/eventhub_auth
      EVENT_DATABASE_URL: postgresql://eventhub_event_owner:eventhub_event_owner@postgres:5432/eventhub_event
      TICKETING_DATABASE_URL: postgresql://eventhub_ticketing_owner:eventhub_ticketing_owner@postgres:5432/eventhub_ticketing
      LIVE_DATABASE_URL: postgresql://eventhub_live_owner:eventhub_live_owner@postgres:5432/eventhub_live
      NOTIFICATION_DATABASE_URL: postgresql://eventhub_notification_owner:eventhub_notification_owner@postgres:5432/eventhub_notification
      COMMUNITY_DATABASE_URL: postgresql://eventhub_community_owner:eventhub_community_owner@postgres:5432/eventhub_community
    volumes:
      - jwt-keys:/app/services/auth/keys
      - jwt-public:/app/public-keys
      - notification-keys:/app/services/notification/keys
    command:
      - sh
      - -c
      - |
        set -e

        # ONLY IF ABSENT. Regenerating on every `up` would invalidate every
        # token already issued, so a running demo would start answering 401 for
        # no visible reason.
        if [ -f /app/services/auth/keys/private.pem ]; then
          echo "setup: signing keypair already present, keeping it"
        else
          echo "setup: generating the JWT signing keypair"
          cd /app/services/auth && node scripts/generate-keys.mjs && cd /app
        fi

        # ONLY THE PUBLIC HALF LEAVES jwt-keys. Every service that verifies a token
        # mounts jwt-public instead. They used to mount jwt-keys itself, read-only,
        # with private.pem at 0600 -- which kept out nobody, because every container
        # runs as the same `node` user that owns the file. scripts/verify-key-custody.mjs
        # asserts it from inside each container. Copied on every run, so a
        # regenerated keypair cannot leave a stale public key behind.
        cp /app/services/auth/keys/public.pem /app/public-keys/public.pem

        # Notification's keypair, which Auth seals email requests to. The script
        # keeps an existing keypair, and on every run copies ONLY the public half
        # into jwt-keys, where Auth reads it. The private half stays in
        # notification-keys, which nothing but Notification will mount.
        echo "setup: Notification's keypair"
        node /app/services/notification/scripts/generate-keys.mjs

        echo "setup: migrating auth"
        DATABASE_URL="$$AUTH_DATABASE_URL" pnpm --filter @eventhub/auth exec prisma migrate deploy
        echo "setup: migrating event"
        DATABASE_URL="$$EVENT_DATABASE_URL" pnpm --filter @eventhub/event exec prisma migrate deploy
        echo "setup: migrating ticketing"
        DATABASE_URL="$$TICKETING_DATABASE_URL" pnpm --filter @eventhub/ticketing exec prisma migrate deploy
        echo "setup: migrating live"
        DATABASE_URL="$$LIVE_DATABASE_URL" pnpm --filter @eventhub/live exec prisma migrate deploy
        echo "setup: migrating notification"
        DATABASE_URL="$$NOTIFICATION_DATABASE_URL" pnpm --filter @eventhub/notification exec prisma migrate deploy
        echo "setup: migrating community"
        DATABASE_URL="$$COMMUNITY_DATABASE_URL" pnpm --filter @eventhub/community exec prisma migrate deploy

        # Auth only. Every service's prisma.config.ts declares the same seed
        # command and only Auth has the file, so running this against the others
        # dies on a missing module.
        echo "setup: seeding auth"
        DATABASE_URL="$$AUTH_DATABASE_URL" pnpm --filter @eventhub/auth exec prisma db seed

        # Seeded users get no card from /register, so they are queued here. Only
        # users who never had one: a second `up` queues nothing.
        #
        # PORT is given although the command listens on nothing: Auth's db.ts validates
        # the whole base environment, and PORT has no default there. Without it the
        # command died with "PORT: Expected number, received nan" — in this job only,
        # because the verifier runs it with Auth's full environment.
        echo "setup: queueing contact cards"
        PORT=3001 DATABASE_URL="$$AUTH_DATABASE_URL" APP_DATABASE_URL="$$AUTH_APP_DATABASE_URL" pnpm --filter @eventhub/auth run contact-cards:publish

        # Not optional: the broker runs with KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
        # on purpose, so nothing will create these on first publish.
        echo "setup: creating topics"
        node scripts/create-topics.mjs
        echo "setup: registering Avro schemas"
        node scripts/register-schemas.mjs

        # From index-definition.ts, before the indexer can write anything. Needs
        # only OPENSEARCH_NODE, set above: the script reads cluster-env.ts.
        echo "setup: creating the search index"
        pnpm --filter @eventhub/search run bootstrap:index

        # Idempotent, and refuses a migration edited after it was applied.
        echo "setup: migrating analytics"
        pnpm --filter @eventhub/analytics run migrate

        echo "setup: done"

  auth:
    <<: *app
    container_name: eventhub-auth
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    environment:
      <<: *app-env
      PORT: 3001
      DATABASE_URL: postgresql://eventhub_auth_owner:eventhub_auth_owner@postgres:5432/eventhub_auth
      APP_DATABASE_URL: postgresql://eventhub_auth_app:eventhub_auth_app@postgres:5432/eventhub_auth
    volumes:
      # The only container that gets the PRIVATE key, because it is the only one
      # that signs. jwt.ts resolves keys/ relative to its own file, so the mount
      # point is fixed by dist/ sitting one level below it.
      - jwt-keys:/app/services/auth/keys:ro
    working_dir: /app/services/auth
    command: ["node", "dist/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  event:
    <<: *app
    container_name: eventhub-event
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3002:3002"
    environment:
      <<: *app-env
      PORT: 3002
      DATABASE_URL: postgresql://eventhub_event_owner:eventhub_event_owner@postgres:5432/eventhub_event
      APP_DATABASE_URL: postgresql://eventhub_event_app:eventhub_event_app@postgres:5432/eventhub_event
      # The PUBLIC key, as a path rather than a value. The keypair does not exist
      # until setup has run, and compose cannot put a value one container
      # produced into another container's environment -- a shared volume is the
      # only thing both can see. publicKeyFromEnv takes either form.
      AUTH_PUBLIC_KEY_FILE: /run/eventhub/keys/public.pem
    volumes:
      - jwt-public:/run/eventhub/keys:ro
    working_dir: /app/services/event
    command: ["node", "dist/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3002/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  ticketing:
    <<: *app
    container_name: eventhub-ticketing
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3003:3003"
    environment:
      <<: *app-env
      PORT: 3003
      DATABASE_URL: postgresql://eventhub_ticketing_owner:eventhub_ticketing_owner@postgres:5432/eventhub_ticketing
      APP_DATABASE_URL: postgresql://eventhub_ticketing_app:eventhub_ticketing_app@postgres:5432/eventhub_ticketing
      # The sweeper's cross-tenant credential, which the API holds for ONE read:
      # a webhook arrives with no tenant, and the route looks up which tenant the
      # payment belongs to (routes/webhooks.ts). The sweeper does NOT run in this process --
      # it is ticketing-sweeper, below.
      SWEEPER_DATABASE_URL: postgresql://eventhub_ticketing_sweeper:eventhub_ticketing_sweeper@postgres:5432/eventhub_ticketing
      AUTH_PUBLIC_KEY_FILE: /run/eventhub/keys/public.pem
      # Local only, and the same value the .env.example carries. A real secret
      # would come from the environment, never from a committed file.
      PAYMENT_WEBHOOK_SECRET: dev_webhook_secret
    volumes:
      - jwt-public:/run/eventhub/keys:ro
    working_dir: /app/services/ticketing
    command: ["node", "dist/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3003/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Ticketing's hold sweeper: returns the seats of every hold that lapsed.
  #
  # Its own process and its own credential, because it works ACROSS tenants -- a
  # TTL sweep selects by expiry, which has no tenant -- so it gets a role bounded
  # by grants and not the API's. See src/sweeper/index.ts.
  #
  # Until this was added nothing ran it. The block above said "the sweeper and
  # reconciler run inside this process" and handed the API SWEEPER_BATCH_SIZE and
  # SWEEPER_INTERVAL_MS, but dist/index.js never imports the sweeper; only
  # verifiers ran it, with --once. Measured on the stack: a lapsed hold was still
  # HELD 30 s later with its seats out of inventory, and a leftover one had sat
  # HELD six days past its expiry. Every abandoned checkout removed its seats for
  # good, and the symptom is "sold out" on an event that is not.
  #
  # scripts/verify-compose-hold-sweeper.mjs lets a hold lapse in the running stack
  # and requires it back without starting a sweeper of its own.
  # ---------------------------------------------------------------------------
  ticketing-sweeper:
    <<: *app
    container_name: eventhub-ticketing-sweeper
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      SWEEPER_DATABASE_URL: postgresql://eventhub_ticketing_sweeper:eventhub_ticketing_sweeper@postgres:5432/eventhub_ticketing
      SWEEPER_BATCH_SIZE: 100
      SWEEPER_INTERVAL_MS: 5000
    working_dir: /app/services/ticketing
    command: ["node", "dist/sweeper/index.js"]

  # ---------------------------------------------------------------------------
  # The Live service: the only stateful one in the fleet.
  #
  # Every other service here handles a request and forgets you. Live holds a TCP
  # connection open for the length of a conference session and pushes messages
  # down it, which is what makes Redis necessary at all — a socket is a file
  # descriptor owned by ONE process, so a second replica could not reach it.
  #
  # ONE REPLICA HERE, and that is the honest limitation of compose. The thing
  # worth demonstrating is a message crossing between pods, and
  # `docker compose up --scale live=2` cannot express it while a host port is
  # published. scripts/verify-live-fanout.mjs spawns two pods itself and proves
  # it properly; this container is the one an operator talks to.
  # ---------------------------------------------------------------------------
  live:
    <<: *app
    container_name: eventhub-live
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "3004:3004"
    environment:
      <<: *app-env
      PORT: 3004
      DATABASE_URL: postgresql://eventhub_live_owner:eventhub_live_owner@postgres:5432/eventhub_live
      APP_DATABASE_URL: postgresql://eventhub_live_app:eventhub_live_app@postgres:5432/eventhub_live
      # redis, not 127.0.0.1: inside the network the host mapping does not exist.
      REDIS_URL: redis://redis:6379
      AUTH_PUBLIC_KEY_FILE: /run/eventhub/keys/public.pem
      # A suffix rather than a list, and permissive locally because there is no
      # front end yet. WebSocket handshakes are not subject to CORS, so this is
      # the only thing standing between a page on another origin and a socket.
      ALLOWED_ORIGIN_SUFFIX: localhost
      # Nothing to drain from in compose, and waiting 15 s on every `down` is
      # only irritating. Production wants the real delay.
      LIVE_DRAIN_DELAY_MS: 0
    volumes:
      - jwt-public:/run/eventhub/keys:ro
    working_dir: /app/services/live
    command: ["node", "dist/index.js"]
    healthcheck:
      # /health is LIVENESS and never fails during a drain. /ready is the one
      # that flips to 503 on SIGTERM, which is what a load balancer would watch.
      test: ["CMD-SHELL", "curl -sf http://localhost:3004/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # The outbox relay. No HTTP API and no public key: it reads committed rows and
  # publishes them, so it needs neither to verify a caller nor to sign anything.
  #
  # Its own database role, which can read the outbox and mark rows published and
  # cannot touch the Event tables. That is the point of a separate credential.
  # ---------------------------------------------------------------------------
  relay:
    <<: *app
    container_name: eventhub-relay
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3010:3010"
    environment:
      <<: *app-env
      RELAY_DATABASE_URL: postgresql://eventhub_event_relay:eventhub_event_relay@postgres:5432/eventhub_event
      RELAY_METRICS_PORT: 3010
      RELAY_BATCH_SIZE: 100
      RELAY_POLL_INTERVAL_MS: 1000
      RELAY_MAX_ATTEMPTS: 5
    working_dir: /app/services/relay
    command: ["node", "dist/index.js"]
    healthcheck:
      # /metrics is the only route it serves, and answering it means the process
      # is up AND its database connection works -- the endpoint runs a query.
      test: ["CMD-SHELL", "curl -sf http://localhost:3010/metrics >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # The same relay, draining Ticketing's outbox: seat holds and purchases.
  #
  # One relay drains one database, so Ticketing's outbox needs an instance of its
  # own. Until this was added compose ran only the Event relay, and Ticketing's
  # messages committed and were never sent -- 290 were waiting on one local stack,
  # the oldest for eleven days. scripts/verify-outbox-relays.mjs now requires a
  # relay here for every service whose schema has an OutboxMessage table.
  # ---------------------------------------------------------------------------
  relay-ticketing:
    <<: *app
    container_name: eventhub-relay-ticketing
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3011:3011"
    environment:
      <<: *app-env
      RELAY_DATABASE_URL: postgresql://eventhub_ticketing_relay:eventhub_ticketing_relay@postgres:5432/eventhub_ticketing
      # A table that exists in THIS database and that the relay role must not read.
      # The default, Event, is not in Ticketing's database, and the relay refuses to
      # start rather than pass its privilege check against a missing table.
      RELAY_FORBIDDEN_TABLE: Reservation
      RELAY_METRICS_PORT: 3011
      RELAY_BATCH_SIZE: 100
      RELAY_POLL_INTERVAL_MS: 1000
      RELAY_MAX_ATTEMPTS: 5
    working_dir: /app/services/relay
    command: ["node", "dist/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3011/metrics >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # The same relay, draining Auth's outbox: sealed email requests.
  #
  # What it publishes is ciphertext (see services/auth/src/email-request.ts), but it
  # still reads every tenant's rows, so it gets what the others get: a role that can
  # read the outbox and nothing else, checked at boot against User.
  # ---------------------------------------------------------------------------
  relay-auth:
    <<: *app
    container_name: eventhub-relay-auth
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3012:3012"
    environment:
      <<: *app-env
      RELAY_DATABASE_URL: postgresql://eventhub_auth_relay:eventhub_auth_relay@postgres:5432/eventhub_auth
      RELAY_FORBIDDEN_TABLE: User
      RELAY_METRICS_PORT: 3012
      RELAY_BATCH_SIZE: 100
      RELAY_POLL_INTERVAL_MS: 1000
      RELAY_MAX_ATTEMPTS: 5
    working_dir: /app/services/relay
    command: ["node", "dist/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3012/metrics >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # The same relay again, draining Community's outbox: posts, comments and
  # reactions on their way to community.feed. The fourth instance of one binary,
  # pointed at a fourth database by RELAY_DATABASE_URL.
  #
  # RELAY_FORBIDDEN_TABLE is Post here: the relay asserts at boot that its
  # credential cannot read the service's own business tables, and Post is the one
  # that would hurt most to leak across tenants.
  # ---------------------------------------------------------------------------
  relay-community:
    <<: *app
    container_name: eventhub-relay-community
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3013:3013"
    environment:
      <<: *app-env
      RELAY_DATABASE_URL: postgresql://eventhub_community_relay:eventhub_community_relay@postgres:5432/eventhub_community
      RELAY_FORBIDDEN_TABLE: Post
      RELAY_METRICS_PORT: 3013
      RELAY_BATCH_SIZE: 100
      RELAY_POLL_INTERVAL_MS: 1000
      RELAY_MAX_ATTEMPTS: 5
    working_dir: /app/services/relay
    command: ["node", "dist/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3013/metrics >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Community: spaces, posts, threaded comments, reactions and moderation.
  #
  # Connects as eventhub_community_app, which owns nothing, and refuses to start as
  # a role that could bypass RLS. Verifies tokens with Auth's public key from the
  # jwt-public volume, as every other verifying service does.
  # ---------------------------------------------------------------------------
  community:
    <<: *app
    container_name: eventhub-community
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "3008:3008"
    environment:
      <<: *app-env
      PORT: 3008
      DATABASE_URL: postgresql://eventhub_community_owner:eventhub_community_owner@postgres:5432/eventhub_community
      APP_DATABASE_URL: postgresql://eventhub_community_app:eventhub_community_app@postgres:5432/eventhub_community
      # The membership cache and the rate limiter's buckets. redis, not 127.0.0.1:
      # inside the network the host mapping does not exist.
      REDIS_URL: redis://redis:6379
      AUTH_PUBLIC_KEY_FILE: /run/eventhub/keys/public.pem
    volumes:
      - jwt-public:/run/eventhub/keys:ro
    working_dir: /app/services/community
    command: ["node", "dist/index.js"]
    healthcheck:
      # /ready, not /health: it asks Postgres as the app role, and nothing else here
      # would notice the database being unreachable.
      test: ["CMD-SHELL", "curl -sf http://localhost:3008/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Search: the indexer consuming events.activity into OpenSearch, and the
  # service that will answer queries.
  #
  # Waits on setup only. setup already waits for OpenSearch and creates the index,
  # and the service itself listens whether or not the cluster is there — /ready
  # is what says whether it can serve.
  # ---------------------------------------------------------------------------
  search:
    <<: *app
    container_name: eventhub-search
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3005:3005"
    environment:
      <<: *app-env
      PORT: 3005
      OPENSEARCH_NODE: http://opensearch:9200
      # The degraded path, called with the caller's own token.
      EVENT_SERVICE_URL: http://event:3002
      AUTH_PUBLIC_KEY_FILE: /run/eventhub/keys/public.pem
      # Signs pagination cursors. Local only, and the same value .env.example
      # carries; a real deployment generates its own and never commits it.
      SEARCH_CURSOR_SECRET: local-development-cursor-secret-0123456789
    volumes:
      - jwt-public:/run/eventhub/keys:ro
    working_dir: /app/services/search
    command: ["node", "dist/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3005/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Analytics: the read side of ClickHouse. Connects as analytics_app — SELECT
  # and INSERT only — and never holds the migrator credential, which setup uses
  # and nothing else does. Verifies tokens with Auth's public key from the
  # jwt-public volume, as Search does: the tenant every query binds is the token's.
  # ---------------------------------------------------------------------------
  analytics:
    <<: *app
    container_name: eventhub-analytics
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3006:3006"
    environment:
      <<: *app-env
      PORT: 3006
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: analytics
      CLICKHOUSE_USER: analytics_app
      CLICKHOUSE_PASSWORD: analytics_app
      AUTH_PUBLIC_KEY_FILE: /run/eventhub/keys/public.pem
    volumes:
      - jwt-public:/run/eventhub/keys:ro
    working_dir: /app/services/analytics
    command: ["node", "dist/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3006/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Analytics ingest: the same image and package as the API, from its other
  # entrypoint. A separate container because the two scale on different things
  # -- partitions for this one, dashboard traffic for the API -- and a large
  # flush must not stall an HTTP response on a shared event loop.
  #
  # analytics_app, like the API: INSERT is all it needs. The group starts at
  # 'earliest', so a fresh ClickHouse volume fills from whatever the topics
  # still retain.
  # ---------------------------------------------------------------------------
  analytics-ingest:
    <<: *app
    container_name: eventhub-analytics-ingest
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3016:3016"
    environment:
      <<: *app-env
      INGEST_PORT: 3016
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: analytics
      CLICKHOUSE_USER: analytics_app
      CLICKHOUSE_PASSWORD: analytics_app
      KAFKA_CONSUMER_GROUP: analytics-ingest
      INGEST_START_FROM: earliest
    working_dir: /app/services/analytics
    command: ["node", "dist/consumer.js"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3016/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Notification: consumes auth.email-requested, opens each sealed request with its
  # own private key, checks Auth's signature, claims the delivery in its sent-log,
  # and sends through Mailpit.
  #
  # The only container that mounts notification-keys, because it is the only one
  # that decrypts. It connects as eventhub_notification_app, which owns nothing,
  # and refuses to start as a role that could bypass RLS.
  # ---------------------------------------------------------------------------
  notification:
    <<: *app
    container_name: eventhub-notification
    depends_on:
      setup:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    ports:
      - "3007:3007"
    environment:
      <<: *app-env
      PORT: 3007
      DATABASE_URL: postgresql://eventhub_notification_owner:eventhub_notification_owner@postgres:5432/eventhub_notification
      APP_DATABASE_URL: postgresql://eventhub_notification_app:eventhub_notification_app@postgres:5432/eventhub_notification
      # A third role for the sweep that ends deliveries claimed and never finished:
      # it crosses tenants, so it is not the API's credential. SELECT and a
      # three-column UPDATE, and the service refuses to sweep on anything wider.
      SWEEPER_DATABASE_URL: postgresql://eventhub_notification_sweeper:eventhub_notification_sweeper@postgres:5432/eventhub_notification
      # A fourth, for the hourly reply digest: who has replies waiting, across
      # tenants, and nothing else. It refuses to start on anything wider.
      DIGEST_DATABASE_URL: postgresql://eventhub_notification_digest:eventhub_notification_digest@postgres:5432/eventhub_notification
      KAFKA_CONSUMER_GROUP: notification-dispatch
      # Verifies Auth's signature inside each seal. The public half only.
      AUTH_PUBLIC_KEY_FILE: /run/eventhub/keys/public.pem
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: no-reply@eventhub.local
      # The development value from .env.example. NODE_ENV is development here; a
      # production process refuses to start with this.
      UNSUBSCRIBE_SECRET: dev-only-unsubscribe-secret-change-me-0123456789
    volumes:
      - jwt-public:/run/eventhub/keys:ro
      # keys/ resolves beside dist/, so the layout fixes this mount point.
      - notification-keys:/app/services/notification/keys:ro
    working_dir: /app/services/notification
    command: ["node", "dist/index.js"]
    healthcheck:
      # /ready, not /health: it queries Postgres as the app role, and nothing else
      # here would notice the database being unreachable.
      test: ["CMD-SHELL", "curl -sf http://localhost:3007/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # The gateway. Every external request enters here: Kong OSS, DB-less, reading
  # infra/kong/kong.yml at boot and holding no state, so a config that does not
  # parse stops it starting rather than leaving it half-configured. That file says
  # what it routes and why.
  #
  # The proxy, 8000, is the one port meant for the outside. The Admin API listens
  # on the container's OWN loopback and is published nowhere: in DB-less mode it
  # cannot change one entity, but POST /config replaces the whole configuration,
  # tenant snippet included, and it has no authentication. On 0.0.0.0 inside the
  # container, any service on this network could have rewritten the gateway. To
  # read it, join Kong's network namespace:
  #   docker run --rm --network container:eventhub-kong --entrypoint curl \
  #     eventhub/app:local -s http://127.0.0.1:8001/routes
  # Kong Manager, the GUI on 8002 and 8445 by default, is off for the same reason.
  # The status endpoint is read-only and published on loopback.
  #
  # A tenant is a subdomain, so locally: http://acme.eventhub.localhost:8000/...
  # Browsers and curl resolve any *.localhost name to loopback by themselves.
  # ---------------------------------------------------------------------------
  kong:
    image: kong:3.9
    container_name: eventhub-kong
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_ADMIN_GUI_LISTEN: "off"
      # Inside the container, so the port mapping below can reach it; published to
      # 127.0.0.1 only.
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: info
      # The default, written down: the tenant snippet runs in Kong's Lua sandbox.
      KONG_UNTRUSTED_LUA: sandbox
    volumes:
      - ./infra/kong:/kong/declarative:ro
    ports:
      - "8000:8000"
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres-data:
  kafka-data:
  opensearch-data:
  clickhouse-data:
  # The JWT keypair, generated once by setup. A volume rather than a bind mount
  # so it never lands in the working tree, and never in an image layer. Mounted by
  # setup and Auth ONLY: it holds the private key, which can mint any token.
  jwt-keys:
  # The public half alone, copied out of jwt-keys by setup on every run. This is
  # the volume every service that verifies a token mounts.
  jwt-public:
  # Notification's keypair, generated once by setup. Its public half is copied into
  # jwt-keys for Auth to seal to; the private half never leaves this volume.
  notification-keys:
