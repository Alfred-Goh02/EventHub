name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the first run rather than queueing behind
# it. On a free plan the minutes are finite, and a superseded run tells you
# nothing you still care about.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest

    # NOTE: there is deliberately no `services:` block. The whole stack comes up
    # from docker-compose.yml as a job step instead.
    #
    # Two reasons, both learned rather than assumed:
    #
    #   1. Actions service containers have no `depends_on` between each other.
    #      cp-schema-registry's entrypoint runs `cub kafka-ready` against the
    #      broker, so as a service container it depends on winning a race that
    #      Actions does not arrange. `docker compose up --wait` honours the
    #      healthchecks and depends_on the compose file already declares.
    #
    #   2. Service containers forced a config that DIFFERS from local — they
    #      share the runner's network namespace, so Kafka had to advertise
    #      localhost on both listeners rather than a compose service name. Two
    #      configurations for one broker is exactly the drift CI exists to catch.
    #
    # Using compose also means the Postgres bootstrap runs through the image's
    # own /docker-entrypoint-initdb.d hook, the same path as a fresh laptop —
    # so CI no longer needs a separate step to apply it.

    env:
      # Auth's databases. DATABASE_URL is the owner (migrations only);
      # APP_DATABASE_URL owns nothing so RLS applies to it.
      DATABASE_URL: postgresql://eventhub_auth_owner:eventhub_auth_owner@localhost:5432/eventhub_auth
      APP_DATABASE_URL: postgresql://eventhub_auth_app:eventhub_auth_app@localhost:5432/eventhub_auth
      # Event's own database. Separate credentials entirely — this role cannot
      # even open a connection to eventhub_auth.
      EVENT_DATABASE_URL: postgresql://eventhub_event_owner:eventhub_event_owner@localhost:5432/eventhub_event
      EVENT_APP_DATABASE_URL: postgresql://eventhub_event_app:eventhub_event_app@localhost:5432/eventhub_event
      # Ticketing: a third database, again with its own credentials.
      TICKETING_DATABASE_URL: postgresql://eventhub_ticketing_owner:eventhub_ticketing_owner@localhost:5432/eventhub_ticketing
      TICKETING_APP_DATABASE_URL: postgresql://eventhub_ticketing_app:eventhub_ticketing_app@localhost:5432/eventhub_ticketing

      LIVE_DATABASE_URL: postgresql://eventhub_live_owner:eventhub_live_owner@localhost:5432/eventhub_live
      LIVE_APP_DATABASE_URL: postgresql://eventhub_live_app:eventhub_live_app@localhost:5432/eventhub_live
      NOTIFICATION_DATABASE_URL: postgresql://eventhub_notification_owner:eventhub_notification_owner@localhost:5432/eventhub_notification
      NOTIFICATION_APP_DATABASE_URL: postgresql://eventhub_notification_app:eventhub_notification_app@localhost:5432/eventhub_notification
      COMMUNITY_DATABASE_URL: postgresql://eventhub_community_owner:eventhub_community_owner@localhost:5432/eventhub_community
      COMMUNITY_APP_DATABASE_URL: postgresql://eventhub_community_app:eventhub_community_app@localhost:5432/eventhub_community
      # The sweeper credential. The reconciler runs on it, and the payment
      # webhook uses it for ONE statement: resolving which tenant a payment
      # belongs to. A webhook arrives with no tenant, and every table here is
      # FORCE ROW LEVEL SECURITY, so the app role would see zero rows.
      SWEEPER_DATABASE_URL: postgresql://eventhub_ticketing_sweeper:eventhub_ticketing_sweeper@localhost:5432/eventhub_ticketing
      # A test value. Ticketing REFUSES TO START without it, deliberately: a
      # webhook route with no secret is an unauthenticated write path into
      # payment state.
      PAYMENT_WEBHOOK_SECRET: dev_webhook_secret
      JWT_ISSUER: https://auth.eventhub.local
      JWT_AUDIENCE: eventhub-api
      NODE_ENV: test
      PORT: 3001
      LOG_LEVEL: info

    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from packageManager in package.json, so CI and
      # local can never drift.
      - uses: pnpm/action-setup@v4

      # Read from .nvmrc rather than hardcoded here, so the version lives in ONE
      # place. CI testing a different Node than you develop on means CI cannot
      # catch a version-specific problem, and you cannot reproduce a CI failure.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails rather than silently updating the lockfile. If
      # this step fails, someone changed a dependency without committing the
      # lockfile — which is exactly what you want CI to catch.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Following the README's setup to the letter left Kafka unusable: it
      # migrated one service of three, and never mentioned create-topics.mjs or
      # register-schemas.mjs at all. The broker runs with auto-creation disabled
      # on purpose, so nothing filled the gap -- the system started cleanly and
      # died at the first publish with "This server does not host this
      # topic-partition", which names neither the missing topic nor the script.
      #
      # The README already said this workflow was authoritative, which is an
      # honest admission that a second copy of a procedure drifts. This is what
      # stops the drift being silent. The ratchet runs the right way round: a NEW
      # setup step is red until it is documented or recorded as one a human does
      # not need, so the default for an undocumented step is failure.
      #
      # Reads files only; no infrastructure, so it runs before anything is up.
      - name: Assert the documented setup builds the system this workflow builds
        run: node scripts/verify-readme-setup.mjs

      # The shared vocabulary must match the things it claims to describe.
      #
      # packages/types opens by saying "a shared type that disagrees with
      # reality is worse than no type, because consumers trust it". Two of its
      # three types disagreed: ReservationStatus declared PENDING, which is not
      # a state this system has, and omitted HELD and PENDING_PAYMENT -- the two
      # the whole seat and payment design turns on. TicketReservedEvent had no
      # tenantId, no state, and flattened the items ARRAY to one line.
      #
      # Neither was imported anywhere, which is the only reason nothing broke.
      # They would have been wrong for the first consumer to trust them, and the
      # failure would have looked like a bug in that consumer.
      #
      # Compared against the SOURCES -- the Prisma enums, and the list of Avro
      # records that already have a generator -- because a check comparing two
      # hand-maintained lists just adds a third thing to keep in step. The
      # second half is a ratchet: nothing in the shared package may re-declare a
      # record contracts/generated already emits, since a hand copy can only
      # drift and this one had.
      - name: Assert the shared types match their schemas and contracts
        run: node scripts/verify-shared-types.mjs

      # A migration runs as the table owner with no app.tenant_id, and FORCE row
      # security binds the owner too -- so an UPDATE or DELETE on a FORCE table
      # matches zero rows and succeeds. Two merged migrations did exactly that and
      # changed nothing: event's empty-slug backfill and ticketing's delete of
      # leftover in_progress idempotency keys. Measured as each owner: UPDATE 0 and
      # DELETE 0 under FORCE, UPDATE 2 and DELETE 53 with it lifted.
      #
      # Walks every service's migrations in order, tracking FORCE per table, and
      # fails any write to a table under FORCE at that point. Reads files only, so
      # it runs before anything is up.
      - name: Assert no migration writes to a table row security hides from it
        run: node scripts/verify-migration-force-rls.mjs

      # Kong reads infra/kong/kong.yml at boot and refuses to start on one it cannot
      # parse, so a bad edit would surface as an unhealthy container in the compose
      # job, named nowhere. This names it. KONG_DATABASE=off is required: without it
      # the parser looks for Postgres before it looks at the file.
      #
      # And the file Kong actually LOADS: the template plus the consumer that
      # render-consumer.lua adds at start, rendered here with a throwaway key. Parsing
      # the template alone said nothing about a render that broke the YAML, or a
      # template the render refuses.
      - name: Assert the gateway's declarative config parses
        run: |
          set -euo pipefail
          docker run --rm -e KONG_DATABASE=off -v "$PWD/infra/kong:/cfg:ro" kong:3.9 kong config parse /cfg/kong.yml
          keys=$(mktemp -d)
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$keys/private.pem" 2>/dev/null
          openssl pkey -in "$keys/private.pem" -pubout -out "$keys/public.pem"
          rm "$keys/private.pem"
          chmod 755 "$keys" && chmod 644 "$keys/public.pem"
          docker run --rm -e KONG_DATABASE=off -e AUTH_PUBLIC_KEY_FILE=/keys/public.pem \
            -e JWT_ISSUER=https://auth.eventhub.local -e KONG_DECLARATIVE_CONFIG=/tmp/kong.yml \
            -v "$PWD/infra/kong:/kong/declarative:ro" -v "$keys:/keys:ro" --entrypoint sh kong:3.9 \
            -c 'resty /kong/declarative/render-consumer.lua && kong config parse /tmp/kong.yml'

      # FREE THE RUNNER'S DISK before the stack is pulled. The run that added
      # ClickHouse measured the 72G root filesystem at 91% used by the time the
      # Search verifiers ran, and OpenSearch refuses to create any index past its
      # 90% high watermark: the reindex verifier failed with `cluster
      # create-index blocked (api)`, with cluster.blocks.create_index set to true.
      # These are preinstalled SDKs and images this job never uses.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /

      # The EXACT stack a developer runs, from the same file, with the same
      # config. --wait blocks until every healthcheck passes, so nothing below
      # races a half-started broker.
      #
      # The Postgres bootstrap runs itself here, through the image's
      # /docker-entrypoint-initdb.d hook — the same path as a fresh laptop.
      # Its volume is empty on a runner, so it always fires.
      # NAMED SERVICES, not the whole file. docker-compose.yml also defines the
      # four application services and a setup container now, and a bare
      # `docker compose up -d --wait` would start those too -- then bind 3001,
      # 3002 and 3003, which is exactly where this job starts its own processes
      # from `node dist/index.js`. The second binder loses, and the error names a
      # port rather than the cause.
      #
      # This job wants the infrastructure and its own natively-run services: it
      # builds from the working tree, so testing a container image built from the
      # same tree would add a build and verify the same code twice. The compose
      # application path is a way to RUN the system, not a second thing to test.
      # opensearch, but NOT opensearch-dashboards: Dashboards sits behind the
      # `tools` profile, so naming services here would not start it anyway, and
      # it is a second JVM that nothing in this job talks to.
      #
      # --wait waits for the healthcheck, and that healthcheck asks for YELLOW
      # rather than green on purpose. One node cannot place a replica, so any
      # system index wanting one holds the cluster at yellow forever; waiting
      # for green here would mark the container unhealthy after about four
      # minutes (start_period 30s, then 20 retries 10s apart) and fail the job,
      # blaming OpenSearch for doing exactly what a single node has to do.
      - name: Start infrastructure
        run: docker compose up -d --wait postgres redis kafka schema-registry opensearch clickhouse mailpit

      - name: Show what came up
        run: docker compose ps

      # The guard for "Free runner disk", placed before anything writes to
      # OpenSearch: at its 85% low watermark or past it, fail HERE naming the
      # disk, rather than minutes later as an index_create_block_exception in
      # whichever verifier happens to create an index next.
      - name: Assert the runner has disk headroom for OpenSearch
        run: |
          used=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          echo "root filesystem ${used}% used"
          if [ "$used" -ge 85 ]; then
            echo "::error::root filesystem ${used}% used; OpenSearch stops creating indices at its 90% high watermark"
            exit 1
          fi

      - name: Apply migrations (auth)
        working-directory: services/auth
        run: pnpm exec prisma migrate deploy

      - name: Apply migrations (event)
        working-directory: services/event
        env:
          DATABASE_URL: ${{ env.EVENT_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Apply migrations (ticketing)
        working-directory: services/ticketing
        env:
          DATABASE_URL: ${{ env.TICKETING_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Apply migrations (live)
        working-directory: services/live
        env:
          DATABASE_URL: ${{ env.LIVE_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Apply migrations (notification)
        working-directory: services/notification
        env:
          DATABASE_URL: ${{ env.NOTIFICATION_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Apply migrations (community)
        working-directory: services/community
        env:
          DATABASE_URL: ${{ env.COMMUNITY_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Seed
        working-directory: services/auth
        run: pnpm exec prisma db seed

      # The search index is a schema, so it is created the same way the database
      # schemas are: from a checked-in definition, by a step in this list, never
      # by hand in Dashboards and never by letting the first write invent it.
      #
      # Letting the first write invent it is the specific thing being ruled out.
      # OpenSearch will happily infer a mapping from whatever document arrives
      # first, and the field it would infer wrong is the one isolation rests on:
      # a JSON string becomes `text` with a `.keyword` sub-field, and a `term`
      # filter on an analysed field compares an unanalysed value against
      # analysed terms. The mapping in index-definition.ts pins tenantId to
      # `keyword` for that reason, and this step is what makes the pinned
      # mapping the one that exists.
      - name: Create the search index
        working-directory: services/search
        # Only the cluster address. The script reads cluster-env.ts, not the
        # service's whole configuration -- it used to read all of it, and twice
        # a variable added for the HTTP or Kafka side broke this step. Locally
        # the address comes from services/search/.env; the package script uses
        # --env-file-if-exists precisely so that both paths work.
        env:
          OPENSEARCH_NODE: http://127.0.0.1:9200
        run: pnpm run bootstrap:index

      # ClickHouse has no migration tool and no DDL transactions, so the runner
      # applies idempotent statements in filename order and refuses a migration
      # edited after it was applied. It connects as analytics_migrator: the only
      # credential that can create a table, held by this step and by nothing that
      # answers requests.
      - name: Migrate analytics (ClickHouse)
        working-directory: services/analytics
        env:
          CLICKHOUSE_URL: http://127.0.0.1:8123
          CLICKHOUSE_MIGRATOR_USER: analytics_migrator
          CLICKHOUSE_MIGRATOR_PASSWORD: analytics_migrator
        run: pnpm run migrate

      # CHAPTER 7, PART 1: what Analytics' storage rests on, asserted before any
      # code writes to it. The service's user is refused CREATE, DROP, TRUNCATE
      # and DELETE (tested on a victim table, so a wrong grant can only destroy
      # the victim). Migrations apply once and refuse an edited one. The sparse
      # index prunes by tenant and prunes nothing without it.
      #
      # And a retried batch counts once in the raw table AND the rollup. The
      # Field Guide says the dedup token propagates to materialized views; on
      # ClickHouse 25.8 it does not by itself -- the duplicate was dropped from
      # the raw table and aggregated into the rollup, and only the sums showed
      # it. The verifier keeps that measurement as a check, so a ClickHouse that
      # changes it turns this red instead of leaving the migration's warning stale.
      - name: Assert analytics storage is least-privilege, deduplicated, and pruned by tenant
        run: node scripts/verify-analytics-schema.mjs

      # Keys are gitignored, so CI generates its own throwaway pair. Never reuse
      # a real signing key in CI — anything in a build environment is readable by
      # anything else running there.
      # Topics are created from a checked-in script, not by auto-creation, which
      # is disabled on the broker. Auto-creation silently makes a topic named
      # after your typo, with default settings nobody chose.
      - name: Create Kafka topics
        run: node scripts/create-topics.mjs


      # The topics on the BROKER must match the decisions written down about
      # them -- asserted against the cluster, not by reading the script back.
      #
      # events.activity.dlq had no retention of its own and inherited the broker
      # default, log.retention.hours=168. The topic whose stated purpose is
      # "keep every failure for a human to look at" was deleting them after
      # seven days, and #42 had just finished routing more things into it.
      #
      # It went unnoticed because create-topics.mjs only ever created MISSING
      # topics: on a cluster where they already existed it printed "all topics
      # already exist" and exited 0. Every configEntry in that file described
      # what the topics were made with once, not what they are -- so adding
      # retention.ms would have changed nothing, successfully. The script now
      # reconciles config and prints what it changed.
      #
      # Config only, never partitions: raising the partition count of a
      # compacted keyed topic rehashes which partition a key lands on, which
      # breaks the one-aggregate-one-partition ordering events.activity rests
      # on. That is a planned migration, not a setup script noticing a number.
      - name: Assert the topics match the decisions recorded about them
        run: node scripts/verify-topic-configs.mjs

      # Round-trips real messages and asserts the property the whole partition-key
      # design rests on: messages sharing a key land on one partition, so ordering
      # holds per key while different keys spread out for parallelism.
      - name: Kafka round-trip and partition-key check
        run: node scripts/kafka-smoke.mjs

      # The Avro path was the only unproven link: schema registration and
      # serialisation happened on one laptop and nowhere else, while every other
      # invariant in this repo is asserted on each PR.
      - name: Register Avro schemas
        run: node scripts/register-schemas.mjs

      # Asserts that the payload the Event service actually writes can be encoded
      # against the registered schema. Its failure mode is a poison message: a
      # row that can never be serialised, re-selected on every drain, blocking
      # everything behind it — with a growing backlog as the only symptom.
      - name: Verify the schema contract
        run: node scripts/verify-schema-contract.mjs

      # Generated types are committed, so editing a .avsc without regenerating
      # would ship types that quietly disagree with the wire format. Regenerating
      # here and comparing turns that into a red build.
      #
      # Generated from the COMMITTED .avsc, never from the live registry — a
      # build that needs port 8081 is not a reproducible build.
      #
      # TWO CHECKS, because no single git command does both reliably.
      #
      # This was `git diff --exit-code` alone, which compares TRACKED files. A
      # brand-new .avsc produces a brand-new .ts, which is UNTRACKED, and git
      # diff ignores it entirely:
      #
      #   $ echo x > contracts/generated/never-committed.ts
      #   $ git diff --exit-code -- contracts/generated; echo $?
      #   0
      #
      # So the one case where a generated file is MISSING rather than merely
      # stale was the one case the gate could not see — it surfaced on someone
      # else's clone, as an unresolved import in a package that built fine for
      # its author. `git ls-files --others` is the check for that.
      #
      # And `git status --porcelain` is NOT the check for the other half, even
      # though it reports both. On a checkout with core.autocrlf=true it reports
      # content-identical files as modified, so a contributor running this
      # locally on Windows would get a failure this repository had not earned.
      # git diff is content-based and gets that case right.
      - name: Avro types are up to date and every generated file is committed
        run: |
          node scripts/generate-avro-types.mjs

          UNTRACKED=$(git ls-files --others --exclude-standard -- contracts/generated)
          if [ -n "$UNTRACKED" ]; then
            echo "a generated file was never committed:"
            echo "$UNTRACKED"
            echo ""
            echo "  git add the file above. Until then it exists only here and on"
            echo "  the machine that generated it, and every other clone fails to"
            echo "  resolve the import."
            exit 1
          fi

          git diff --exit-code -- contracts/generated || {
            echo ""
            echo "contracts/generated is stale — a schema changed without regenerating."
            echo "Run: node scripts/generate-avro-types.mjs"
            exit 1
          }

      # Up to date is not the same as correct.
      #
      # The step above only proves the committed output matches what the
      # generator produces today. It said yes for two chapters while that output
      # referenced an interface that was never declared: the generator collected
      # nested ENUMS but not nested RECORDS, so every array-of-record field
      # emitted `items: Array<ReservationLine>` with no ReservationLine anywhere
      # in the file. Nothing imported these files and no tsconfig included them,
      # so they were documentation that happened to end in .ts.
      #
      # Compiling them is what turns that from invisible into a red build.
      - name: Generated Avro types actually compile
        run: pnpm --filter @eventhub/contracts build

      - name: Generate JWT keypair
        working-directory: services/auth
        run: node scripts/generate-keys.mjs

      # Notification's keypair, whose public half the script copies into
      # services/auth/keys. Auth refuses to start without it, because a reset it
      # issued could never be delivered, so this runs before anything boots Auth.
      - name: Generate Notification's keypair
        run: node services/notification/scripts/generate-keys.mjs

      # Can a fresh clone actually START these services?
      #
      # Every service ships a .env.example whose first line says "Copy to .env
      # and adjust". Nothing checked that the copy WORKS -- this workflow sets
      # its environment from the env: block above instead, so .env.example was
      # the one piece of configuration here that no job ever exercised. It
      # drifted exactly the way an unexercised file does: Ticketing's omitted
      # PAYMENT_WEBHOOK_SECRET, and Ticketing REFUSES TO START without it, on
      # purpose, because a webhook route with no secret is an unauthenticated
      # write path into payment state. The refusal was right; the instructions
      # were wrong; nothing could tell the difference.
      #
      # This boots each service on a scratch port with ITS .env.example and
      # NOTHING ELSE -- deliberately not inheriting this job's environment,
      # since inheriting is precisely how a missing variable stays invisible.
      # One printed exemption: AUTH_PUBLIC_KEY_B64 is generated rather than
      # configured, so it comes from the keypair generated in the step above,
      # which is what the setup instructions tell a human to do.
      #
      # Placed here, before anything long-running starts, because the Ticketing
      # instance it boots joins the real projection consumer group.
      - name: Assert every service boots from its own .env.example
        run: node scripts/verify-env-example.mjs

      # A request body the client got wrong is the client's fault. Every service's
      # error middleware answered all errors 500, and express.json() runs before
      # any route, so `--data '{'` and a body past its 100 kB limit both answered
      # 500 {"error":"internal error"} and were logged as "unhandled error", from
      # all seven services measured -- and the gateway admits bodies up to 1 MB.
      # They share one handler now, in @eventhub/http, which answers 400 and 413.
      #
      # And text Postgres cannot store: a NUL (which it refuses, 22021) or a lone
      # surrogate (which the driver silently stores as U+FFFD), in a body or a
      # query string. Measured through the gateway, a NUL answered 500 from Event's
      # create and search and Ticketing's reservations, and 409 "slug already
      # exists" from Community, which read any failed raw query as a duplicate.
      # @eventhub/http's refuseUnstorableText answers 400 now, and Community's 409
      # is for Postgres's 23505 only; this drives the measured routes with minted
      # tokens, and Ticketing's webhook with real signatures.
      #
      # Boots every service whose source calls express.json(), from its own
      # .env.example on spare ports it first proves are free, as the step above
      # does and with the same rule for Kafka: every group is this run's, starts
      # at the end, and is deleted afterwards. Here because everything it needs is
      # up and built, and nothing long-running has started yet.
      - name: Assert a malformed, oversized or unstorable request answers 4xx from every service
        run: node scripts/verify-client-errors.mjs

      # The check that actually matters: does the COMPILED output boot and serve?
      # Type-checking proves the code is consistent, not that it runs.
      - name: Smoke test the compiled service
        working-directory: services/auth
        run: |
          node dist/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/health > /dev/null; then break; fi
            sleep 1
          done

          echo "--- health ---"
          curl -sf http://localhost:3001/health

          echo ""
          echo "--- login as the seeded admin ---"
          TOKEN=$(curl -sf -X POST http://localhost:3001/login \
            -H 'Content-Type: application/json' \
            -H 'X-Tenant-Slug: acme' \
            -d '{"email":"alice@acme.com","password":"hunter2222"}' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).accessToken))")
          test -n "$TOKEN" || { echo "no access token returned"; kill $SERVER_PID; exit 1; }

          echo ""
          echo "--- authenticated /me ---"
          curl -sf http://localhost:3001/me -H "Authorization: Bearer $TOKEN"

          echo ""
          echo "--- the same address in a different case must still log in ---"
          # issueInvite() lowercases before storing, /login did not lowercase
          # before looking up, and User is unique on the stored value -- so a
          # user invited as "Bob.Smith@Acme.COM" got 401 with the exact address
          # they were invited at, and only the lowercased form worked. A lockout
          # that looks identical to a wrong password.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3001/login \
            -H 'Content-Type: application/json' \
            -H 'X-Tenant-Slug: acme' \
            -d '{"email":"ALICE@ACME.COM","password":"hunter2222"}')
          test "$CODE" = "200" || { echo "expected 200 for an upper-case address, got $CODE"; kill $SERVER_PID; exit 1; }
          echo "upper-case address accepted ($CODE)"

          echo ""
          echo "--- the tenant a user joins comes from the invite, not the request ---"
          # This used to be a curl asserting that
          #
          #   POST /register  X-Tenant-ID: tenant_globex
          #   {"email":"attacker@evil.com","password":"hunter2222"}
          #
          # returns 400, under a comment saying "the tenant hole is open". The
          # body has no `token` field and registerSchema requires one, so the
          # 400 came from Zod before lookupInvite() was ever called. Measured:
          #
          #   {"error":{"formErrors":[],"fieldErrors":{"token":["Required"]}}}
          #
          # Delete invite verification entirely and it still passed. It asserted
          # that a schema has a required field.
          #
          # The property it was reaching for was tested NOWHERE: /register takes
          # no X-Tenant-ID at all, deliberately, because the tenant comes from an
          # invite created by someone already inside that tenant. The verifier
          # redeems a real tenant_acme invite while claiming tenant_globex and
          # asserts membership THROUGH row-level security -- visible under the
          # invite's tenant, invisible under the one the request asked for.
          #
          # $GITHUB_WORKSPACE, not a relative path: this step runs with
          # working-directory: services/auth, so `node scripts/...` looked for
          # services/auth/scripts and died with MODULE_NOT_FOUND. The curl it
          # replaced never noticed, because a URL does not care where you are.
          node "$GITHUB_WORKSPACE/scripts/verify-invite-tenant-binding.mjs"

          echo ""
          echo "--- what the repository declares, it must have ---"
          # Two unrelated mechanisms, one shape: something is written down,
          # nothing checks it, and the gap only shows when a person follows the
          # declaration. The same shape has already produced a mechanism
          # documented and never called, a schema comment describing a control
          # that had moved, and an .env.example that could not boot its service.
          #
          # Here: every prisma.config.ts declared seed: "tsx prisma/seed.ts" and
          # only Auth has that file, so `prisma db seed` in Event or Ticketing
          # died on a missing module -- and CI only ever seeds Auth, so nothing
          # noticed. The check is a ratchet: whatever a config declares, the
          # file has to exist.
          #
          # And /me answered `200 null` for a valid token whose user row was
          # gone. Reachable because access tokens are stateless and live 15
          # minutes with no revocation -- a deliberate trade -- so a deleted
          # user keeps a working credential for that long. A client reading
          # .email off that response crashes.
          node "$GITHUB_WORKSPACE/scripts/verify-declared-but-absent.mjs"
          echo ""
          echo "--- refusing a login must cost the same either way ---"
          # Returning early on a missing user skipped the argon2id verify, and
          # argon2id is expensive ON PURPOSE -- 19 MB and two passes, which is
          # the whole reason it was chosen over bcrypt. Measured, 8 runs each:
          #
          #   wrong password, account EXISTS : median 13 ms
          #   wrong password, account MISSING: median  3 ms
          #
          # Same 401 body either way, so the response TIME was the answer: an
          # attacker enumerates registered addresses one request each, without
          # ever guessing a password.
          #
          # It also contradicted a decision made forty lines below it in the
          # same file -- /forgot-password returns 202 unconditionally,
          # explicitly so that a caller cannot learn whether an address exists.
          #
          # A miss now verifies against a dummy hash computed once at startup.
          # The assertion is on the RATIO of medians with a loose 2x bound, not
          # on any millisecond figure, so runner noise cannot trip it while a
          # skipped 19 MB hash cannot hide in it. The control is that a correct
          # login still costs about the same -- if argon2 were not running at
          # all every median would collapse together and the ratio would pass
          # for the wrong reason.
          node "$GITHUB_WORKSPACE/scripts/verify-login-timing.mjs"

          kill $SERVER_PID

      # A refresh token must be spendable exactly ONCE, including under a race.
      #
      # rotateRefreshToken() used to read the row on its own connection, outside
      # any transaction and holding no lock, check usedAt, then write
      # `update({ where: { id } })` with no predicate. Two requests presenting the
      # same token concurrently both passed the check and both minted a
      # successor: one token, two independent live sessions.
      #
      # What made that worse than it sounds is that FAMILY REUSE DETECTION NEVER
      # FIRES. The detector looks for a token presented a second time, and in
      # this race there is not one -- each party walks away with a distinct
      # successor. The control was not bypassed, it was blind.
      #
      # A sequential test cannot catch it: present a token twice in a row and
      # reuse is correctly reported. The window is between the read and the
      # write, so the test has to race. This one reproduced the defect in 19 of
      # 20 rounds against the unfixed code.
      - name: Assert a refresh token can be spent only once, even under a race
        working-directory: .
        run: |
          (cd services/auth && node dist/index.js &)
          for i in $(seq 1 25); do
            if curl -sf http://localhost:3001/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-refresh-rotation.mjs
          pkill -f "node dist/index.js" || true

      # /logout had NO test. Not a weak one -- none. Nothing in scripts/ named
      # the route and nothing here ran it, found by listing every HTTP route in
      # the three services and asking which had no assertion anywhere. It was
      # the only one.
      #
      # A bad route to leave unasserted: its entire job is revocation, it is the
      # control a user reaches for on a shared machine, and every way it can fail
      # fails silently behind a 204. A logout that revoked nothing looks exactly
      # like one that worked, while the refresh token in somebody else's hands
      # keeps minting sessions for thirty days.
      #
      # The load-bearing case is the second: log out with an already-spent
      # PARENT and assert the live successor dies too. Revoking only the
      # presented row passes every other assertion in the file -- verified by
      # making exactly that change and watching case 2, and only case 2, go red.
      - name: Assert logging out ends the session, and only that session
        working-directory: .
        run: |
          (cd services/auth && node dist/index.js &)
          for i in $(seq 1 25); do
            if curl -sf http://localhost:3001/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-logout.mjs
          pkill -f "node dist/index.js" || true

      # /login and /forgot-password used to believe a client-sent X-Tenant-ID. The
      # gateway now clears it and passes the Host's subdomain as X-Tenant-Slug, and
      # Auth resolves that to a tenant. This asserts Auth's half: a slug signs in to
      # its own tenant (the seed holds one account in two, so only the slug can tell
      # them apart), X-Tenant-ID is read nowhere, an unknown slug is a wrong
      # password, and a tenant created just after its slug missed signs in at once,
      # which a cache that kept misses would break.
      - name: Assert a sign-in's tenant is the gateway's slug and nothing else
        working-directory: .
        run: |
          (cd services/auth && node dist/index.js &)
          for i in $(seq 1 25); do
            if curl -sf http://localhost:3001/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-tenant-slug.mjs
          pkill -f "node dist/index.js" || true

      # Seventeen variables the code read that no .env.example mentioned -- the
      # relay's entire pruning configuration, and the whole surface of
      # Ticketing's reconciler and sweeper. The README tells a reader to copy
      # .env.example, so each one was a knob they could not know existed.
      #
      # AUTH_DEV_TOKEN_SINK is the one that shows why it matters: it is the
      # switch that prints invite and reset tokens where a developer can see
      # them, and with it undocumented the README's own invite flow has a step a
      # reader cannot complete -- the token goes nowhere and nothing says why.
      #
      # Needs no services running: it compares source against .env.example.
      - name: Assert every variable the code reads is one the reader is given
        run: node scripts/verify-env-documented.mjs

      # The image installs dependencies before copying source, so every
      # workspace package's manifest is COPYed individually first -- and that
      # list is a maintenance trap. Adding services/live sprang it: pnpm install
      # ran without Live's manifest, and the build failed far away with "Local
      # package.json exists, but node_modules missing", which names the symptom
      # and not the cause. Nothing connected that message to a missing line.
      - name: Assert the image installs every workspace package
        run: node scripts/verify-dockerfile-workspaces.mjs

      # An outbox nothing drains is a queue of messages that committed and are
      # never sent, and nothing errors. Compose ran a relay for Event only, while
      # Ticketing's seat holds and purchases waited for one. Every service whose
      # schema has an OutboxMessage table must have a relay in compose.
      - name: Assert every outbox has a relay in compose
        run: node scripts/verify-outbox-relays.mjs

      # A service with no stop_grace_period gets whatever the engine picks, and
      # Docker Desktop before 4.81 picks one second: Kafka was killed mid-shutdown
      # and recovered 87 logs on its next start. This runner's engine gives 10 s,
      # so nothing else here can see it. Every service must set its own.
      - name: Assert every compose service sets its own stop grace period
        run: node scripts/verify-stop-grace-periods.mjs

      # A process compose never starts is a process that never runs. It happened twice:
      # Ticketing's hold sweeper, then its payment reconciler, each its own entry point
      # and each missing from compose, so lapsed holds kept their seats and unanswered
      # charges stayed UNKNOWN. Every file under services/*/src that runs a main(),
      # handles SIGTERM or listens must be a compose command, or a one-shot under
      # src/scripts/ that does neither of the last two. Static: compose config only.
      - name: Assert compose starts every long-running process
        run: node scripts/verify-compose-starts-every-process.mjs

      # The redaction list is a backstop, and a backstop nobody exercises is a
      # list of strings. This one had three holes that reading it did not reveal:
      # `authorization` carried no `*.authorization` while all six of its
      # neighbours had their wildcard, and `secret` and `privateKey` were absent
      # altogether. Both name variables this codebase holds -- webhooks.ts reads
      # PAYMENT_WEBHOOK_SECRET into `const secret`, and jwt.ts holds the RS256
      # signing key.
      #
      # Runs the real logger in a child process and reads what came out, because
      # createLogger writes to stdout and takes no destination. Re-implementing
      # the redaction to compare against would test a copy.
      - name: Assert the logger redacts what its list says it redacts
        run: node scripts/verify-log-redaction.mjs

      # THE ONE CLAIM CHAPTER 5 EXISTS TO MAKE GOOD ON: a question posted on one
      # Live pod reaches a client connected to a DIFFERENT Live pod.
      #
      # Two pods, not one. A WebSocket is a file descriptor owned by one process
      # -- pod B cannot write to a socket held by pod A -- so a single-pod test
      # passes identically whether the fan-out layer exists or not.
      #
      # The verifier spawns both pods itself on 3104 and 3114 and needs Auth
      # running to mint a token. Its positive control is free: delivery happens
      # ONLY in the Redis subscriber callback, so the author's own copy travels
      # through Redis too -- asserting the author sees exactly one proves the bus
      # works AND that the handler is not also writing locally, which would give
      # everyone on the posting pod two copies of everything.
      - name: Assert a question crosses between Live pods, and only within its tenant
        run: |
          (cd services/auth && node dist/index.js &)
          for i in $(seq 1 25); do
            if curl -sf http://localhost:3001/health >/dev/null; then break; fi
            sleep 1
          done

          # LIVE'S ENV GOES ON THE VERIFIER, NOT ON THE STEP.
          #
          # A step-level `env:` block applies to everything the step runs --
          # including the Auth service started above. Putting
          # APP_DATABASE_URL=<live> there pointed Auth at eventhub_live, and it
          # answered /login with
          #
          #   The table `public.User` does not exist in the current database.
          #
          # Scoped to this one command, the pods the verifier spawns inherit it
          # and Auth keeps the job's own.
          #
          # KAFKA_BROKERS is required by Live's env schema even though this test
          # asserts nothing about the topic: fail-fast at startup is the point,
          # and the run without it said exactly "KAFKA_BROKERS: Required".
          APP_DATABASE_URL="${{ env.LIVE_APP_DATABASE_URL }}"           REDIS_URL="redis://127.0.0.1:6379"           KAFKA_BROKERS="localhost:9092"           ALLOWED_ORIGIN_SUFFIX=".eventhub.local"           AUTH_PUBLIC_KEY_B64="$(base64 -w0 services/auth/keys/public.pem)"             node scripts/verify-live-fanout.mjs

          pkill -f "node dist/index.js" || true

      # A token is for one tenant's subdomain. Auth names it in the token, the gateway
      # names the subdomain a request came in on, and when they disagree the service
      # answers 403 instead of quietly acting on the token's tenant. Asserted on the
      # shared middleware (Event's /whoami) and on Live's handshake, which verifies on
      # its own -- and which, before this, took a genuine signature for ANY audience or
      # issuer, and would start on an Origin suffix with no leading dot (`localhost`
      # admitted `evillocalhost`). Starts its own Event and Live, from their
      # .env.example.
      - name: Assert a token is honoured only on its own tenant's subdomain
        run: node scripts/verify-token-tenant.mjs

      # CHAPTER 6'S ISOLATION CLAIM: every tenant's events share ONE index, and
      # a tenant's search still cannot return another tenant's documents.
      #
      # One index rather than one per tenant, because a shard is a whole Lucene
      # index carrying tens of megabytes of heap even when nearly empty, and a
      # long tail of small tenants kills a cluster on heap long before disk. The
      # isolation comes instead from a filtered alias per tenant, which the
      # engine ANDs onto every query sent through it.
      #
      # TWO LAYERS, and the first version of this step checked one. The alias
      # filter confines which DOCUMENTS match. It does not confine what the
      # engine reads off the shard: through tenant A's own filtered alias, a
      # min_doc_count 0 aggregation listed tenant B's titles and a suggester
      # offered B's words. So the module accepts no raw body -- a closed,
      # validated request, built into a query server-side -- and this step sends
      # the raw leak as a control before asserting the module cannot express it.
      #
      # Also asserted: tenant ids shaped like index expressions ('*', commas) are
      # refused; an existing alias with no filter is repaired rather than trusted
      # by name; a document indexed without routing is invisible to its own
      # tenant. Every tenant in the test shares one shard, chosen by asking the
      # cluster, because on different shards each of those leaks passes as
      # isolation. Nothing is written until the index and aliases are confirmed.
      - name: Assert a tenant's search cannot reach another tenant's documents
        env:
          OPENSEARCH_NODE: http://127.0.0.1:9200
        run: node scripts/verify-search-tenant-isolation.mjs

      # CHAPTER 6, PART 2: the indexer, under the delivery Kafka actually gives
      # -- at least once, in no promised order across a rebalance.
      #
      # Asserted: the same snapshot twice leaves _version alone; an OLDER
      # snapshot arriving late changes nothing; a stale snapshot replayed over a
      # deleted event leaves it deleted (why deletes are a status, not a DELETE:
      # tombstones are garbage-collected after 60 seconds and a later stale write
      # would resurrect the event); an undecodable message is parked and the
      # partition moves past it; and what the indexer writes is found through
      # its tenant's alias only, which holds only if its routing is right.
      #
      # Every "nothing changed" waits first for the version-conflict counter to
      # rise by one. A duplicate that was never consumed also changes nothing.
      #
      # The verifier starts its own indexer under a fresh consumer group, so no
      # other step here has a second consumer writing to the shared DLQ.
      - name: Assert the search indexer is idempotent, refuses stale snapshots, and is never blocked
        env:
          OPENSEARCH_NODE: http://127.0.0.1:9200
          KAFKA_BROKERS: localhost:9092
          SCHEMA_REGISTRY_URL: http://localhost:8081
        run: node scripts/verify-search-indexer.mjs

      # CHAPTER 6, PART 3: GET /search, over HTTP, against the real service.
      #
      # The tenant is the signed claim and nothing else -- no token, a forged
      # one, alg none, an expired or wrong-audience token are 401, and
      # X-Tenant-ID changes nothing. Public search shows published, upcoming
      # events; ?includePast=false is sent as the STRING "false", because
      # z.coerce.boolean() would read it as true. Typos still find, a title
      # match outranks a description match, facets add up to the total.
      #
      # And with OpenSearch unreachable, a second Search instance falls back to
      # the Event service: capped at 50, published only, scoped by the caller's
      # own token through RLS, with a literal "%" matching only a literal "%".
      # So Event runs here too, from this build, for its /events/search.
      - name: Assert GET /search answers only for the signed tenant, and degrades rather than breaks
        run: |
          AUTH_PUBLIC_KEY_B64=$(base64 -w0 services/auth/keys/public.pem)
          export AUTH_PUBLIC_KEY_B64

          (cd services/event && PORT=3002 DATABASE_URL="$EVENT_DATABASE_URL" APP_DATABASE_URL="$EVENT_APP_DATABASE_URL" node dist/index.js &)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3002/health >/dev/null; then break; fi
            sleep 1
          done

          OPENSEARCH_NODE=http://127.0.0.1:9200 KAFKA_BROKERS=localhost:9092 SCHEMA_REGISTRY_URL=http://localhost:8081 EVENT_URL=http://localhost:3002 \
            node scripts/verify-search-api.mjs

          pkill -f "node dist/index.js" || true

      # CHAPTER 6, PART 4: deep pagination -- search_after inside a
      # Point-in-Time, behind a signed cursor.
      #
      # 50 events at 10 a page must come back as exactly 50 distinct ids,
      # including ten that share one start time across a page boundary, which
      # is where a sort with no unique tiebreaker skips rows. An event indexed
      # mid-traversal must not appear in later pages. A cursor presented by
      # another tenant, with another query, or with one byte changed is a 400.
      # A traversal that ends leaves no PIT open, and a page whose PIT has gone
      # is a 410.
      #
      # And the backstop: a VALIDLY signed cursor for tenant B carrying tenant
      # A's PIT -- what a leaked signing secret would allow -- still reads
      # nothing of A's, because every query filters on the caller's tenant too.
      - name: Assert paging returns every result once, holds still, and cannot cross tenants
        env:
          OPENSEARCH_NODE: http://127.0.0.1:9200
          KAFKA_BROKERS: localhost:9092
          SCHEMA_REGISTRY_URL: http://localhost:8081
        run: node scripts/verify-search-pagination.mjs

      # CHAPTER 6, PART 5: changing the index without downtime. Analysis happens
      # at index time and shard count cannot change in place, so a mapping or
      # analyzer change is a new index, filled from the old one, and an alias
      # swap.
      #
      # Run against the real migration code on scratch indices, while a tenant's
      # search loops and writes land: no write is lost (including one after the
      # copy and before the swap, which only moving writes first can place), no
      # older copy overwrites a newer write, no search fails or comes back empty,
      # every tenant alias moves with its filter in the same atomic call, and the
      # whole thing can be run backwards.
      - name: Assert a migration to a new index loses nothing, fails nothing, and can be undone
        env:
          OPENSEARCH_NODE: http://127.0.0.1:9200
        run: node scripts/verify-search-reindex.mjs

      # CHAPTER 6, PART 6: the two numbers that decide whether Search is healthy,
      # and that no HTTP metric shows. Indexer lag, in MESSAGES -- offsets, not
      # wall-clock time, which read 12329 seconds on an idle healthy consumer
      # once -- must rise while the indexer is stopped and return to 0 because
      # it caught up. A replay must raise the version-conflict counter by exactly
      # the number replayed and dead-letter nothing. Searches are counted by
      # outcome and timed, and the live index carries its slowlog threshold.
      - name: Assert /metrics shows how stale search is and whether redelivery is normal
        env:
          OPENSEARCH_NODE: http://127.0.0.1:9200
          KAFKA_BROKERS: localhost:9092
          SCHEMA_REGISTRY_URL: http://localhost:8081
        run: node scripts/verify-search-observability.mjs

      # CHAPTER 7, PART 2: Kafka into ClickHouse, each message counted once.
      # Delivery is at least once and a rollup cannot be deduplicated after the
      # fact, so the write must be safe to repeat. The first design took its
      # dedup token from the batch's offsets; a redelivery that ends later counts
      # the overlap twice under it, which this keeps as a control. The one that
      # shipped dedupes by message id, which also catches a republish at a new
      # offset. Also asserted: one row per ticket line with its own money, poison
      # kept in ingest_dlq without blocking its partition, and offsets committed
      # after the write -- which the first version never did: kafkajs's
      # commitOffsetsIfNecessary() with autoCommit off commits nothing, and the
      # group's offsets sat at -1 after every message was written.
      - name: Assert ingest counts each message once, keeps poison, and commits after the write
        env:
          KAFKA_BROKERS: localhost:9092
          SCHEMA_REGISTRY_URL: http://localhost:8081
        run: node scripts/verify-analytics-ingest.mjs

      # CHAPTER 7, PART 3: the read API. The tenant is the token's claim and nothing
      # else, and every route the router declares is asked for another tenant's
      # event -- including an event id both tenants use, which a query filtering
      # on the event alone answers with the SUM. A route added without a probe
      # fails this. Also: people counted once across days rather than once per
      # day, money kept per currency, reads that merge rollup rows no background
      # merge has collapsed yet, and an unreachable store answered as a 503.
      - name: Assert the analytics API answers only the token's tenant, with numbers that add up
        run: node scripts/verify-analytics-api.mjs

      # CHAPTER 7, PART 4: the failure drills, run rather than described. One
      # insert per message makes one part per message where a batch makes one, and
      # /metrics reports each table's worst partition beside the server's own
      # thresholds. A rollup corrupted on purpose is rebuilt from the raw table and
      # comes back equal to it. A consumer whose ClickHouse is unreachable commits
      # nothing while lag climbs by exactly what was produced, and drains to zero
      # with every message landed once when ClickHouse is back. "Unreachable" is a
      # closed port, never a stopped container every other step shares.
      - name: Assert analytics survives its failure drills, and shows lag and part counts
        env:
          KAFKA_BROKERS: localhost:9092
          SCHEMA_REGISTRY_URL: http://localhost:8081
        run: node scripts/verify-analytics-drills.mjs

      # The password reset flow, including the failure that returns success.
      #
      # The highest-value assertion here is the dullest: that the password
      # ACTUALLY CHANGES. "User" is the one table in this database under FORCE
      # ROW LEVEL SECURITY, so a reset written outside withTenant matches zero
      # rows -- and with a guarded updateMany that is not an error, it is a count
      # of 0. The endpoint would return 200, the token would be spent, every
      # session would be revoked, and the password would be untouched. The user
      # is signed out everywhere and locked out of an account whose reset link is
      # now used, and NOTHING about that is visible in the response.
      #
      # Also races two redemptions of one link with different passwords. Under
      # read-then-write both succeed and the account keeps whichever committed
      # last -- so the victim believes they set their password while the
      # attacker's is the live one. Measured: 10 of 10 races had two winners
      # before the guard went in.
      # Invite.revokedAt was read in two places and written in none, so a
      # mis-sent invitation stayed redeemable for its full seven days.
      #
      # The cross-tenant half is what needs a test rather than a reading:
      # Invite is deliberately RLS-EXEMPT, because a tenant policy would filter
      # out the very row that tells /register which tenant to use. So unlike
      # almost every other write in this service there is no policy underneath
      # to catch a missing scope, and the tenantId filter in the query is the
      # only thing stopping one admin revoking every tenant’s invitations.
      - name: Assert an invitation can be withdrawn, and only within its tenant
        run: |
          (cd services/auth && node dist/index.js &)
          for i in $(seq 1 25); do
            if curl -sf http://localhost:3001/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-invite-revocation.mjs
          pkill -f "node dist/index.js" || true

      - name: Assert password reset works and each token spends once
        run: |
          (cd services/auth && node dist/index.js &)
          for i in $(seq 1 25); do
            if curl -sf http://localhost:3001/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-password-reset.mjs
          pkill -f "node dist/index.js" || true

      # /login had no rate limit: 25 wrong passwords gave 25 x 401 and never a
      # 429 -- unbounded guessing, with every guess costing the server an
      # argon2id verify.
      #
      # Three budgets now, and the first one is the one that refuses: failures
      # for one account FROM ONE ADDRESS. Keying the refusing budget on the
      # account alone was itself an attack -- anyone who knew an address could
      # spend that account's budget from their own machine and the owner was
      # locked out, which is a denial of service against any address an attacker
      # can guess. The per-account budget survives as a far higher backstop
      # against one password tried from many machines, and the per-address
      # budget bounds total argon2 work. Failures only, checked before the
      # password is verified, both cleared on a successful sign-in.
      #
      # The verifier starts its OWN auth instances on ports 3097, 3096 and 3095
      # with tiny limits, because the limiter is per-process memory: exhausting
      # the budget on the shared :3001 instance would lock every later step that
      # logs in from localhost -- the lockout #30 already fixed once. The third
      # runs with TRUST_PROXY=1, which is the only way a test can present itself
      # as two different clients.
      - name: Assert /login stops a guesser without locking out the account's owner
        run: node scripts/verify-login-rate-limit.mjs

      # A password-reset email leaves Auth sealed: encrypted to Notification's key,
      # signed by Auth's. Searched for the real token in the outbox row and in the
      # bytes on the topic, and the link from inside the seal must still reset the
      # password. Starts its own Auth with the dev sink on, to learn that token.
      - name: Assert a reset email is queued sealed, and its link still works
        run: node scripts/verify-email-request.mjs

      # And then delivered. Notification opens the seal, checks Auth's signature,
      # claims the delivery once and sends it to Mailpit, where this reads it back.
      # A redelivery, a forged seal and an expired request must send nothing, and a
      # real request queued behind them must still arrive.
      - name: Assert a reset email is delivered once, and nothing refused is sent
        run: node scripts/verify-email-delivery.mjs

      # When a send cannot be completed now. Against a fake SMTP server this run
      # stops and starts: an outage waits in a retry tier and arrives once; one
      # troubled address does not hold up a user on its partition; retries run out
      # into notification.dlq, and a replay from there sends once.
      - name: Assert failed sends are retried without blocking, and run out into the DLQ
        run: node scripts/verify-email-retries.mjs

      # When the recipient's server says the address does not exist. A 550 5.1.1
      # suppresses it for that tenant, and the next reset is recorded SUPPRESSED
      # without a single RCPT TO, even once the server would accept it. A 5.7.1 or a
      # bare 550 suppresses nothing, another tenant with the same address still gets
      # its email, suppression:remove lifts it, and reply text repeating the address
      # reaches no row or Kafka header.
      - name: Assert an address that does not exist is suppressed, and only such an address
        run: node scripts/verify-email-suppression.mjs

      # Invitations. POST /invites handed its link to the dev sink alone, so a deployed
      # system emailed nobody and no one new could join a tenant. Now the invitation and
      # its sealed request commit together: one email at the invited address, whose link
      # registers the invitee, with the token and address nowhere in clear in the outbox
      # or on the topic; the seal expires with the invitation at the database's instant,
      # proved with Auth an hour fast; a re-invite's older link and a revoked one are
      # refused, and two invitations raced on a table lock leave one live; a seal Auth
      # did not sign, a relabelled reset, an unknown role, a line break in the address,
      # an expired request and a suppressed address send nothing; and the budget on
      # POST /invites refuses past its limit, per tenant, on the normalised address.
      - name: Assert an invitation reaches the person invited, once, and nothing forged does
        run: node scripts/verify-invitation-email.mjs

      # Preferences and the unsubscribe link. A user changes only their own choices, in
      # their own tenant; a password reset or an invitation cannot be turned off, and a row planted to
      # say it is off is ignored; the categories are a closed set. Following an
      # unsubscribe link changes nothing — read after a pause, because the first
      # version read at once and missed an unsubscribe fired from GET and not awaited —
      # and POSTing it unsubscribes. Four kinds of tampered token are refused and change
      # nothing, and a production process refuses the public development secret.
      - name: Assert a user turns off only what may be turned off, and an unsubscribe link does one thing
        run: node scripts/verify-notification-preferences.mjs

      # Contact cards. Registering queues each user's address sealed to Notification,
      # keyed tenantId:userId on the compacted topic (read off the topic itself), with
      # no address in the outbox row and an occurredAt stamped by Postgres under the
      # user's row lock — asserted with Auth's clock an hour fast, because on a machine
      # whose clocks agree a stamp from `new Date()` passed. Notification stores the
      # card still sealed; the verifier opens the stored ciphertext itself. The latest
      # signed occurredAt wins; five kinds of forgery are dead-lettered while a genuine
      # card behind them lands; a tombstone withdraws; the publish command queues only
      # users who never had a card, run in its documented form.
      - name: Assert every address reaches Notification sealed, newest first, and nothing forged gets in
        run: node scripts/verify-contact-cards.mjs

      # Reply emails. A reply Community named someone for reaches the address in their
      # contact card, once — the same message again is read (the duplicate counter
      # moves) and sends nothing — with List-Unsubscribe and List-Unsubscribe-Post,
      # and a token checked against the secret for this tenant, user and category. The
      # reply's markup arrives escaped. The link taken from the received email, POSTed,
      # stops the next one. Nobody named, a reply to yourself, a reaction, replies
      # turned off, no card and a suppressed address each send nothing, each with its
      # own counter as proof it was read. A reply retried from a tier is routed as a
      # reply, not decoded as a password reset.
      - name: Assert a reply reaches the person it answers, once, with a way out
        run: node scripts/verify-reply-emails.mjs

      # Five reply emails per person per hour; the rest are held and go out as one
      # digest an hour, with counts and links and none of the replies' words. Exactly
      # five even with replies arriving on two consumers at once. At send time the
      # preference, the card and the suppression list are asked again, a digest taken
      # and never settled is settled without being sent twice, and nothing goes before
      # a pass. The digest's credential reads three columns across tenants and nothing
      # else, and the service refuses to start on a wider one.
      - name: Assert past five an hour, replies wait for one digest of counts and links
        run: node scripts/verify-reply-digest.mjs

      # A delivery is claimed PENDING before anything is sent, and the ones whose
      # message was dead-lettered stay that way for ever. The sweep ends them, on a
      # credential that crosses tenants and may do nothing else: it cannot create a
      # delivery, read the suppression list, or mark anything SENT, and the service
      # refuses to start if it can. A young PENDING row beside them must survive.
      - name: Assert deliveries claimed and never finished are ended, and nothing else is
        run: node scripts/verify-notification-sweeper.mjs

      # Community's database, before a single route exists. Every tenant-scoped table
      # isolates — with the table list READ FROM THE DATABASE, so one added later
      # without a policy fails here — the moderation trail cannot be rewritten, a
      # thread cannot nest past its cap, the outbox's two readers reach exactly as far
      # as they should, and every unique key leads with the tenant.
      - name: Assert Community's tables isolate, and its audit trail cannot be rewritten
        run: node scripts/verify-community-foundation.mjs

      # Who may act in a space, and how often. A private space answers 404 rather than
      # 403, so its existence is not confirmed to a stranger; space roles are read per
      # request and the cache is dropped by whatever changes them, so a promotion takes
      # effect on the next call; and the token bucket is per user, per tenant and
      # ATOMIC — the burst check fires more requests at once than the bucket holds and
      # requires exactly the bucket's worth to pass, which a read-then-write limiter
      # cannot do.
      - name: Assert space roles and the rate limiter hold
        run: node scripts/verify-community-membership.mjs

      # A post and its event are ONE COMMIT: the outbox row is read back beside the
      # post, then the relay publishes it and this reads it off community.feed,
      # decoded against the registered schema and keyed by the space. A thread's
      # shape is the database's job — paths and depths come back a, a.b, a.b.c, a
      # parent on another post is refused by the NOT NULL on path rather than by a
      # separate SELECT, and the ninth level by the CHECK. Reacting twice counts
      # once — and a kind the server did not name is refused, because kind is part of
      # the unique key and an open set let one account invent a kind per request and
      # run a post's rank up. The score is recomputed here from the counters every
      # time, since a score drifting from its counters is invisible until the feed
      # order is wrong. Every symbol in ActivityKind is drained and decoded against
      # the registered schema, not just the one the first section publishes: this job
      # starts infrastructure only, so relay-community is not here to drain what the
      # run leaves behind, and three of the four kinds had no coverage at all.
      - name: Assert a post, its thread and its reactions, and the event they commit with
        run: node scripts/verify-community-posts.mjs

      # The write half of the hybrid feed. A post in a small space reaches every
      # ACTIVE member and nobody else; a space past the threshold is left to the read
      # path, with a small space in the same run as the control so "no rows" cannot
      # pass by nothing having worked. The same message republished writes nothing
      # twice. A comment is consumed as a known kind with nothing to do — the feed
      # ranks by the post's own score — and the app role holds no UPDATE on FeedEntry,
      # asked of the catalog. A message that can never be applied goes to
      # community.feed.dlq and the partition carries on.
      - name: Assert a post reaches the right feeds, exactly once
        run: node scripts/verify-community-feed-fanout.mjs

      # The read half. The whole feed is walked two posts a page while the oldest
      # post's score is lifted mid-walk, and every post must come back exactly once,
      # each page strictly older than the last — which a cursor over rankScore fails:
      # watched red, the lifted post was never returned. The fixture has a space that
      # SHRINKS below the fan-out threshold after posting and one that GROWS past it,
      # so a read path judging size at read time loses a post and one ignoring the
      # fan-out flag returns one twice. A space the reader is banned from holds three
      # posts mid-timeline, so a filter applied after the page is cut lets them eat the
      # window and skips the oldest real post.
      - name: Assert the feed returns every post once, in order, while scores move
        run: node scripts/verify-community-feed-read.mjs

      # Moderation. A moderator's role is judged in the TARGET'S space: one who
      # moderates S1 and is a plain member of S2 asks to hide S2's post, naming S1
      # in the body the way a route trusting its request would be fooled, and must
      # get 403 with the post untouched and nothing audited. Every change writes its
      # audit row in the same transaction; a second HIDE writes none; a report
      # attached to the wrong target is refused AND rolls the hide back with it.
      # Hiding a comment takes its subtree — its replies are not promoted to the top
      # — and the post's count and score are recomputed, so hidden spam stops buying
      # rank. Nothing can be written under hidden content. Eight mutations watched red.
      - name: Assert moderation acts only where the moderator moderates, and is audited
        run: node scripts/verify-community-moderation.mjs

      # Authors' deletes and bans. Only the author deletes, audited once; UNHIDE
      # cannot bring a deleted post back; leaving the space does not strand what you
      # wrote, and a ban stops it. A deleted comment keeps other people's replies: it
      # comes back as a tombstone, with its words and author blanked in SQL, and goes
      # once nothing is left under it. Everyone acts only on lower ranks, judged on
      # the locked row — a moderator demoted behind a still-warm cache is refused.
      # Bans and unbans are audited once each. Five red runs, twelve mutations.
      - name: Assert authors delete only their own words, and bans follow rank
        run: node scripts/verify-community-deletes-bans.mjs

      # The dev token sink writes live invite and password-reset credentials to
      # the log so a developer can click them while there is no mail service.
      # That is exactly the leak the hash-only storage design exists to prevent,
      # so it must be impossible to leave switched on in production.
      #
      # A comment saying "never enable this in production" is not a control.
      # Refusing to boot is. Same shape as the relay and ticketing refuse-to-start
      # checks.
      #
      # PUBLIC_APP_URL is https so that the sink is the only reason left to refuse:
      # production also refuses a plain-http origin, and without one this step went
      # green on THAT refusal with the sink's check deleted. The grep names the sink
      # for the same reason. timeout, so a service that starts fails the step rather
      # than hanging it.
      - name: Assert the dev token sink cannot run in production
        working-directory: services/auth
        run: |
          set +e
          AUTH_DEV_TOKEN_SINK=1 NODE_ENV=production PUBLIC_APP_URL=https://app.eventhub.example PORT=3098 \
            timeout 60 node dist/index.js > /tmp/sink.log 2>&1
          CODE=$?
          set -e
          test "$CODE" != "0" && test "$CODE" != "124" \
            || { echo "the service started with the dev sink enabled in production:"; cat /tmp/sink.log; exit 1; }
          grep -q "Error: refusing to start: AUTH_DEV_TOKEN_SINK" /tmp/sink.log \
            || { echo "exited non-zero but not for the right reason:"; cat /tmp/sink.log; exit 1; }
          echo "correctly refused to start"

      # The cross-service proof: Event verifies a token AUTH signed, holding only
      # the public key, with no call to Auth and no shared session store. If this
      # ever needs a network hop to Auth, the asymmetric-JWT design has been lost.
      - name: Smoke test cross-service token verification
        run: |
          AUTH_PUBLIC_KEY_B64=$(base64 -w0 services/auth/keys/public.pem)
          export AUTH_PUBLIC_KEY_B64

          (cd services/auth && node dist/index.js &)
          (cd services/event && PORT=3002 DATABASE_URL="$EVENT_DATABASE_URL" APP_DATABASE_URL="$EVENT_APP_DATABASE_URL" node dist/index.js &)

          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/health >/dev/null && curl -sf http://localhost:3002/health >/dev/null; then break; fi
            sleep 1
          done

          curl -sf http://localhost:3002/health
          echo ""

          TOKEN=$(curl -sf -X POST http://localhost:3001/login \
            -H 'Content-Type: application/json' -H 'X-Tenant-Slug: acme' \
            -d '{"email":"alice@acme.com","password":"hunter2222"}' \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).accessToken))")
          test -n "$TOKEN" || { echo "auth did not issue a token"; exit 1; }

          echo "--- event verifies a token auth signed ---"
          curl -sf http://localhost:3002/whoami -H "Authorization: Bearer $TOKEN"
          echo ""

          echo "--- a garbage token must be rejected ---"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/whoami -H "Authorization: Bearer not.a.token")
          test "$CODE" = "401" || { echo "expected 401, got $CODE"; exit 1; }
          echo "rejected ($CODE)"

          echo ""
          echo "--- an unannounced event must not be visible to a customer ---"
          # ATTENDEE is the DEFAULT role and the schema calls it "buys tickets,
          # joins the community", so attendees are customers in the same tenant
          # as the organisers. Neither read route filtered on status, so any of
          # them could fetch a DRAFT by id and list every draft in the tenant.
          # Reproduced before the fix:
          #
          #   attendee GET /events/<id>         -> 200 "Secret Launch" (DRAFT)
          #   attendee GET /events?status=DRAFT -> 1 draft(s) visible
          #
          # ONLY draft is hidden. CANCELLED and COMPLETED stay visible to
          # everyone, deliberately: whoever holds a ticket for a cancelled event
          # is the person who most needs to see it.
          #
          # Two positive controls in the script, because without them a route
          # that returned NOTHING would satisfy every assertion: the attendee
          # must still see a PUBLISHED event, and the organiser must still see
          # their own draft.
          node scripts/verify-draft-visibility.mjs

          echo ""
          echo "--- cancelling an event needs more than a job title ---"
          # Every write route required ORGANIZER or ADMIN and that was the whole
          # check, so any organiser could cancel or delete any other organiser's
          # event. organiserId was set from the token at creation and carried
          # into the Kafka snapshot, and no route ever read it back.
          #
          # Cancel and delete now need the creator or an ADMIN. Patch and
          # publish stay OPEN, deliberately -- editing a colleague's event is
          # what a team account is for. The open half is asserted too, so a
          # later reader can tell it is a choice rather than the same oversight.
          #
          # 403 not 404: the caller can already GET the event, so hiding it
          # would deny something they can plainly observe. Another tenant's row
          # still 404s, because there confirming existence IS the leak.
          node scripts/verify-destructive-ownership.mjs

          echo ""
          echo "--- an event must not be patchable into ending before it starts ---"
          # POST has always refused a backwards pair with a Zod .refine(). PATCH
          # never checked, and there was no constraint underneath either. Both of
          # these returned 200:
          #
          #   PATCH { startsAt: <later>, endsAt: <earlier> }
          #   PATCH { startsAt: <past the stored endsAt> }
          #
          # The second is the one a refinement on the request body cannot catch:
          # PATCH is partial, so half the comparison lives in the database.
          #
          # The script asserts the route's 400 and the CHECK constraint
          # SEPARATELY, reaching the constraint by writing straight to the table.
          # A test that only ever goes through the route cannot tell them apart
          # and would keep passing if the constraint were dropped -- which is the
          # layer that actually holds under two concurrent patches.
          node scripts/verify-event-date-ordering.mjs

          echo ""
          echo "--- a tenant must hold more than one non-Latin title ---"
          # slugify() kept only [a-z0-9], so a title in any non-Latin script
          # produced the EMPTY STRING -- Chinese, Cyrillic, Arabic, Greek and
          # emoji all collapse to "". With a partial unique index on
          # (tenantId, slug) WHERE deletedAt IS NULL, the first such title took
          # the empty slug and every one after it was refused. Measured:
          #
          #   CJK title      -> 201  slug ""
          #   Cyrillic title -> 409  "an event with that title already exists"
          #
          # Two titles that share nothing, and a message that is untrue.
          #
          # The control matters as much as the fix: a genuinely duplicate LATIN
          # title must STILL conflict. A change that gave every slug a random
          # suffix would satisfy everything else here while quietly dropping a
          # uniqueness rule somebody chose on purpose.
          node scripts/verify-slug-non-latin.mjs

          pkill -f "node dist/index.js" || true

      # The assertion the whole reservation design exists for.
      #
      # The naive read-then-write has NO protection under READ COMMITTED: both
      # racers read the same count, both conclude they may proceed, and the seat
      # is sold twice. This fires 40 concurrent buyers at 5 seats and asserts
      # exactly 5 succeed, remaining never goes negative, and
      # remaining + held + sold = total still holds.
      - name: Assert the reservation and payment invariants end to end
        env:
          TICKETING_APP_DATABASE_URL: ${{ env.TICKETING_APP_DATABASE_URL }}
        run: |
          # Read the key BEFORE the subshell. A command substitution written
          # inside `(cd services/ticketing && ... $(base64 services/auth/...))`
          # is evaluated after the cd, so the path resolves relative to the
          # WRONG directory and silently yields an empty value.
          AUTH_PUBLIC_KEY_B64=$(base64 -w0 services/auth/keys/public.pem)
          export AUTH_PUBLIC_KEY_B64

          (cd services/auth && node dist/index.js &)
          (cd services/ticketing && \
            PORT=3003 \
            DATABASE_URL="$TICKETING_DATABASE_URL" \
            APP_DATABASE_URL="$TICKETING_APP_DATABASE_URL" \
            node dist/index.js &)

          for i in $(seq 1 25); do
            if curl -sf http://localhost:3001/health >/dev/null \
               && curl -sf http://localhost:3003/health >/dev/null; then break; fi
            sleep 1
          done

          node scripts/verify-no-oversell.mjs

          # The other half of what a reservation promises. Overselling is the
          # failure everyone thinks of; being charged a price you never agreed to
          # is the same class of bug and just as invisible from outside, because
          # the receipt looks perfectly consistent with the ticket type it was
          # read from.
          node scripts/verify-price-locked.mjs

          # A request that did NOTHING must not spend its Idempotency-Key.
          #
          # The key is claimed in step 1, before anything contended, as a row
          # written inside the transaction. So whether a guard RETURNS or
          # THROWS decides whether that claim survives. The endpoint got this
          # right for its inventory guards -- the comment there says why -- and
          # wrong for its two projection guards.
          #
          # unknown-event is where it cost something. That branch answers 503
          # with Retry-After: 2 when the projection consumer is not current,
          # and the committed claim holds a SIXTY-second lease: the service
          # asks for a retry in two seconds and then refuses it for fifty-eight
          # with "a request with this Idempotency-Key is in progress", about a
          # request that finished long ago. Measured before the fix: 404, then
          # 409, then 409.
          #
          # Two positive controls, and the second is load-bearing: sold-out
          # (a guard that already threw) must keep behaving, and a REAL hold
          # must still mark its key completed and replay to the same
          # reservation. Without that last one, an endpoint that simply stopped
          # claiming keys would pass every other assertion here.
          node scripts/verify-idempotency-rollback.mjs

          # An Idempotency-Key must never be TAKEN OVER and run a second time.
          #
          # The claim used ON CONFLICT ... DO UPDATE to take a key over once a
          # 60-second lease expired, which means it ran the work again. For this
          # endpoint that is a SECOND HOLD -- the exact thing the key exists to
          # prevent. Reproduced by planting such a row: one key, two
          # reservations, held 1 -> 2.
          #
          # The lease was there for a crash between claiming and completing, and
          # that cannot happen: the claim and the work commit in ONE transaction.
          # Measured -- 12 concurrent requests on one key gave 12 x 201, a single
          # reservation id, zero in-flight 409s. pay.ts already made this
          # argument for the payment route: "where a lease can expire, a status
          # cannot".
          #
          # The row is PLANTED rather than provoked, because nothing produces one
          # any more -- what is asserted is what happens IF one exists, from old
          # code, a restored backup, or a refactor that splits the transaction.
          #
          # Three controls, and the last two are why the first is safe to want:
          # a new key must still hold seats, and a completed key must still
          # replay to the SAME reservation without taking more. An endpoint that
          # refused everything would pass the takeover assertion on its own.
          node scripts/verify-no-key-takeover.mjs

          # Every outcome of the payment path, including the two that only
          # matter when something goes wrong.
          #
          # A declined card must return the seats to a plain hold rather than
          # cancelling the reservation, and an UNANSWERED provider must leave
          # the seats held and the attempt unsettled -- the money may have moved,
          # and releasing the seats would resell something already paid for.
          # This also runs the sweeper against a PENDING_PAYMENT reservation
          # whose hold has expired, and asserts it does NOT reclaim the seats.
          node scripts/verify-payment-path.mjs

          # The gate that was missing for the whole of Chapter 6: an event
          # cancelled AFTER a hold was taken was still chargeable.
          #
          # POST /reservations always refused to open a hold on an event that
          # was not PUBLISHED. /pay checked nothing at all, so the expensive
          # half of the flow was the unguarded one -- the organiser calls the
          # event off, the cancellation reaches the projection, and a buyer
          # already in checkout is charged for something that is not happening.
          #
          # Two failures, not one. The obvious assertion is that the charge is
          # refused. The one that took a second attempt to get right is that
          # refusing must ROLL BACK: the gate throws so the phase-1 transaction
          # takes the HELD -> PENDING_PAYMENT transition with it. A version
          # that returned instead answered 409 correctly and still stranded the
          # reservation in PENDING_PAYMENT, which the sweeper skips by design --
          # so those seats would be held until a human noticed. Measured: the
          # returning version passes the status-code assertion and fails this.
          node scripts/verify-cancelled-event-gate.mjs

          # The job that decides what happens to a customer whose card may or may
          # not have been charged.
          #
          # Two attempts that are IDENTICAL from this side -- both answered "no
          # answer" -- and differ only in what actually happened at the provider.
          # One must end CONFIRMED, the other must return its hold. Guessing
          # either way is how a seat gets resold after being paid for, or marked
          # sold when nobody paid.
          node scripts/verify-payment-reconciliation.mjs

          # One payment the provider cannot be ASKED about must not stop the
          # reconciler examining the rest.
          #
          # The loop already had a catch, and its comment already said "One bad
          # row must not stop the batch" -- but it covered only the database
          # settlement. provider.lookup(), three lines above it, was outside.
          # A timeout was never the hazard, because withTimeout() RESOLVES to
          # unknown; a rejection is, and it escaped the loop entirely.
          #
          # It does not merely lose one pass. The candidate query is ORDER BY
          # startedAt LIMIT n with no cursor and no per-row failure marking, so
          # the same row is selected first next time. A payment whose lookup
          # fails deterministically sits at the head of every pass forever and
          # everything behind it is never examined -- in the job that decides
          # whether customers who may already have been charged get their seats
          # or their money back.
          #
          # The test imports reconcileOnce() and hands it a provider that throws
          # for one attempt. reconcile.ts imports nothing but types and
          # settleAttempt, so it loads with no environment -- the real function
          # is driven, not a copy of its logic.
          node scripts/verify-reconciler-poison-row.mjs

          # ...and it must stop occupying a SLOT on every pass.
          #
          # The previous fix stopped one throwing lookup abandoning the rest of
          # the batch. It could not fix, without a migration, that the row is
          # still selected FIRST next time: the candidate query is ORDER BY
          # startedAt with no cursor and no record of what already failed. A
          # handful of poison rows shrink the effective batch, and at
          # RECONCILE_BATCH_SIZE of them the job examines nothing else at all --
          # in the job that decides whether customers who may already have been
          # charged get their seats or their money back.
          #
          # Three passes: asked and backed off, skipped, then asked again once
          # the backoff is due. The third is the one that stops the fix being
          # "ignore it forever" -- there is money on the other side of an
          # unsettled payment, so it is deferred, never abandoned. And the delay
          # must GROW, or a fixed interval would pass everything else.
          node scripts/verify-reconciler-backoff.mjs

          # The two retention-critical queries must use their index to ORDER,
          # not merely to filter.
          #
          # An index that is "used" is not an index that helps. Both queries end
          # in ORDER BY ... LIMIT n, and a Bitmap Scan + Sort still names the
          # index in the plan while collecting every matching row and sorting all
          # of them before taking n. Work bounded by the TABLE, not the page --
          # under statement_timeout=15s that eventually stops completing, in the
          # direction where the table keeps growing.
          #
          # Asserted as a CAPABILITY, with seqscan and bitmapscan disabled: on a
          # small CI table a bitmap and a sort really is cheaper and the planner
          # is right to pick it. The question is whether the index CAN serve an
          # ordered scan, which does not move with table size.
          #
          # Explained as the role that RUNS each query, which is not a detail --
          # under FORCE RLS a role with no policy gets a constant-false qual and
          # a different plan entirely. The control is a temp table with a
          # nullable column, because the fix itself (NOT NULL) makes the old OR
          # form fold away on the real table.
          node scripts/verify-query-plans.mjs

          # One attempt, two routes, exactly one settlement.
          #
          # The section titled "a second pass must not move anything twice" in
          # verify-payment-reconciliation.mjs does not test that. It reruns the
          # reconciler after everything is settled, and the candidate query is
          # WHERE "settledAt" IS NULL -- so the second pass selects NOTHING.
          # Measured with the log level raised:
          #
          #   pass 1: examined=8 confirmed=8 released=0 stillUnknown=0
          #   pass 2: examined=0 confirmed=0 released=0 stillUnknown=0
          #
          # Nothing could move twice because nothing was looked at. It does
          # prove settled attempts are excluded from the candidate set, which is
          # worth proving -- but the idempotency guard it appears to be about is
          # never reached.
          #
          # This drives settleAttempt() directly on two overlapping
          # transactions. Two cases, because ONE IS NOT ENOUGH: there are two
          # guards in series, and with the Payment guard deleted the same-answer
          # case still passes -- the reservation guard catches it. Watched that
          # happen. The discriminating case is when the two routes DISAGREE, and
          # without the guard the payment is rewritten to FAILED for a seat that
          # was sold.
          node scripts/verify-settle-once.mjs

          # The webhook, whose interesting problem is not the signature.
          #
          # It arrives with no session, no token and no tenant, and every policy
          # in this database reads app.tenant_id. The tempting fix is to take the
          # tenant from the signature-verified payload -- which would make a
          # leaked signing key a cross-tenant write primitive. This asserts the
          # route ignores a tenantId in the body and resolves it from the
          # database instead, alongside the signature and replay checks.
          node scripts/verify-payment-webhook.mjs

          # Run LAST in this block, because it kills database connections.
          #
          # pg.Pool is an EventEmitter, and an EventEmitter that emits 'error'
          # with no listener THROWS -- in Node, an uncaught exception and an
          # exit. Not one of the five raw pools here had a listener, so a
          # Postgres restart, a managed failover, idle_session_timeout or a
          # load balancer reaping an idle TCP connection killed the process.
          #
          # What makes it worth a test rather than a patch is WHICH pool does
          # the damage. Prisma's adapter installs its own handler, so killing
          # the APPLICATION connection is survived cleanly and the obvious
          # experiment passes. The two raw pools in the webhook route are the
          # unguarded ones, and either takes the WHOLE HTTP SERVICE down --
          # reservations, payments, health -- over a pool that exists to
          # resolve one column for one webhook.
          #
          # Two halves. The behavioural one terminates a real connection and
          # asserts the service still serves AND that the pool replaced it.
          # The static one requires every `new pg.Pool(` in the repository to
          # be wrapped in attachPoolErrorHandler() -- that is the half that
          # catches the SIXTH pool, in a file nobody thinks of as a database
          # file, exactly as the webhook route was. Both were watched fail
          # separately; neither subsumes the other.
          node scripts/verify-pool-resilience.mjs
          pkill -f "node dist/index.js" || true

      # The inventory editor. Nothing created a ticket type before it -- every
      # reservation verifier above inserts its own -- so through the API nobody could
      # put a ticket on sale or buy one. Asserts who may create (the event's
      # organiser, an admin), what may not (past the capacity, a duplicate name, a
      # cancelled or deleted event), eight concurrent creates with room for three
      # (exactly three succeed: every write locks the event first), who sees a
      # draft's tickets, optimistic edits on `revision` that a sale does not make
      # stale, and a reservation of an API-made type. Starts its own Ticketing on a
      # consumer group of its own.
      - name: Assert an organiser can put tickets on sale, within capacity, and edit them
        run: node scripts/verify-ticket-types.mjs

      # Every timestamp on a hold or a payment is on the database's clock. The sweeper
      # reclaims on `"expiresAt" <= now()` and the reconciler selects on startedAt and
      # nextLookupAt against now(), but the reservation route and the pay endpoint
      # stamped those columns with `new Date()`, and Prisma fills a @default(now()) in
      # the client the same way. Measured with Ticketing an hour fast: a ten-minute
      # hold lasted seventy, and every payment stamp was an hour ahead. This starts its
      # own Ticketing an hour fast -- on a machine whose clocks agree no check can see
      # the bug -- and compares each stamp with now() in SQL.
      - name: Assert holds and payments are stamped from the database's clock
        run: node scripts/verify-ticketing-clock.mjs

      # The same bug, everywhere a default stamped a row. Prisma 7 fills
      # @default(now()) in the client, so every outbox row emit() wrote -- whose
      # createdAt the relay publishes as occurredAt -- carried the app server's clock,
      # and Live stamped live.interactions with new Date(). Measured an hour fast:
      # +3600 s on each. Statically, no schema may have a @default(now()); then Auth's
      # emit(), and Event, Ticketing and Live through their APIs, each an hour fast,
      # with every stamp and both live.interactions times compared with now() in SQL.
      - name: Assert row stamps and event times are the database's clock, in every service
        run: node scripts/verify-event-times-from-database.mjs

      # The buyer's side of it. Nothing answered a buyer after POST /reservations and
      # /pay -- not even after /pay said 202, "being confirmed". Asserts a reservation
      # read through its life (held with a countdown, paid, declined twice showing the
      # latest attempt, unanswered then settled by the webhook), that nobody else can
      # read it (another buyer, the event's organiser, another tenant), keyset paging
      # that neither repeats nor skips, and a countdown on Postgres's clock while the
      # service runs an hour fast. Starts its own Ticketing on a consumer group of its own.
      - name: Assert a buyer can see what they bought, and nobody else can
        run: node scripts/verify-reservation-reads.mjs

      # The attendee app lists events soonest first, and opened on ones that were
      # over. ?upcoming=true leaves out what has ended, by Postgres's clock: Event
      # runs an hour fast, so an event ending in half an hour is over by its own
      # clock and must still be listed. Paged one at a time, with an ended event
      # sorted between two upcoming ones, so a filter on the first page only shows.
      - name: Assert the upcoming list leaves out what has ended, by the database's clock
        run: node scripts/verify-upcoming-events.mjs

      # The cross-service assertion, and the one that would have caught the
      # defect the Chapter 4 design review found: only /publish emitted an
      # outbox row, so Ticketing's projection was stale by construction for
      # every other state change.
      #
      # Creates and publishes an event in the Event service, drains the relay,
      # waits for Ticketing's projection to catch up, sells a ticket, cancels the
      # event, and asserts the sale is then refused. Ticketing has no foreign key
      # to the Event table and no credential for that database — Kafka is the
      # ONLY way it can learn any of this.
      # "I have never heard of that event" and "I have not caught up yet" are
      # very different answers, and Ticketing used to give 404 for both.
      #
      # It learns about events by consuming a topic, so there is always a window
      # in which an event is real, on sale, and absent from the projection.
      # Answering 404 there tells a customer an event does not exist while they
      # are trying to buy a ticket for it, and a client that trusts 404 will not
      # retry.
      #
      # ConsumerCheckpoint was built for exactly this decision and the schema
      # comment has described it since it was written -- but the function that
      # measured it was exported and called by NOTHING, and measured the wrong
      # thing besides. This step starts Ticketing FRESH so the cold-start window
      # is real, and asserts both halves: 503 with Retry-After before it is
      # ready, 404 once the broker has confirmed there is nothing more to read.
      - name: Assert a missing event is only reported as not-found once caught up
        run: |
          # Read the key BEFORE the subshell: a command substitution written
          # inside `(cd services/ticketing && ... $(base64 services/auth/...))`
          # is evaluated after the cd, so the path resolves relative to the
          # WRONG directory and silently yields an empty value.
          AUTH_PUBLIC_KEY_B64=$(base64 -w0 services/auth/keys/public.pem)
          export AUTH_PUBLIC_KEY_B64

          (cd services/ticketing && \
            PORT=3003 \
            DATABASE_URL="$TICKETING_DATABASE_URL" \
            APP_DATABASE_URL="$TICKETING_APP_DATABASE_URL" \
            node dist/index.js &)
          (cd services/auth && node dist/index.js &)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health >/dev/null \
               && curl -sf http://localhost:3003/health >/dev/null; then break; fi
            sleep 1
          done
          PROJECTION_COLD_START=1 node scripts/verify-projection-freshness.mjs
          pkill -f "node dist/index.js" || true

      - name: Verify Event to Ticketing projection and the sales rule
        run: |
          AUTH_PUBLIC_KEY_B64=$(base64 -w0 services/auth/keys/public.pem)
          export AUTH_PUBLIC_KEY_B64

          (cd services/auth && node dist/index.js &)
          (cd services/event && \
            PORT=3002 \
            DATABASE_URL="$EVENT_DATABASE_URL" \
            APP_DATABASE_URL="$EVENT_APP_DATABASE_URL" \
            node dist/index.js &)
          (cd services/ticketing && \
            PORT=3003 \
            DATABASE_URL="$TICKETING_DATABASE_URL" \
            APP_DATABASE_URL="$TICKETING_APP_DATABASE_URL" \
            node dist/index.js &)

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health >/dev/null \
               && curl -sf http://localhost:3002/health >/dev/null \
               && curl -sf http://localhost:3003/health >/dev/null; then break; fi
            sleep 1
          done

          node scripts/verify-projection-e2e.mjs
          pkill -f "node dist/index.js" || true

      # The projection must not be movable BACKWARDS by a concurrent older
      # snapshot.
      #
      # The monotonic guard used to be a read and then a write. Two writers
      # both read version 5, one carrying 6 and one carrying 7; both pass the
      # check; both write; whichever commits last wins. If that is the 6, a
      # CANCELLED event returns to PUBLISHED and becomes sellable again.
      #
      # What was actually holding it up was a property of the DEPLOYMENT, not
      # of the code: messages are keyed by aggregate id, so one event maps to
      # one partition and one consumer, sequentially. That is invisible from
      # the consumer, and it stops holding during a rebalance or the day
      # somebody raises the partition count. Nothing fails at that moment --
      # the projection is just wrong sometimes. The guard now lives in the
      # WHERE clause of the write, where Postgres evaluates it under the row
      # lock ON CONFLICT already takes.
      #
      # The statement is IMPORTED from the built module rather than copied, so
      # the assertion cannot drift from the code. The read-then-write shape is
      # reproduced alongside it and its going backwards is asserted too: if
      # that control ever came out right, the test would not be reproducing
      # the race and every other line in it would be meaningless.
      #
      # Needs only the database and the compiled consumer, so it runs after
      # the services above have been stopped.
      - name: Assert the projection cannot move backwards
        run: node scripts/verify-projection-monotonic.mjs

      # Neither can the consumer checkpoint.
      #
      # It is written on EVERY message, including ones the dedup check just
      # discarded -- consuming a redelivery really does mean this partition has
      # been read that far -- and it was an unconditional
      # SET "lastOffset" = EXCLUDED."lastOffset".
      #
      # Replays are routine here, not exceptional: the consumer subscribes
      # fromBeginning against a COMPACTED topic, so one happens on a cold start
      # against a wiped database, on a group reset, and unprompted if Kafka
      # expires the group offsets after a period of inactivity. Each rewound
      # the recorded offset to 0 and climbed back, so an operator reading the
      # table mid-replay saw a checkpoint that was confidently wrong.
      #
      # The schema comment on this table was ALSO wrong, and that is the more
      # interesting half: it claimed the table disambiguates 404 from 503. That
      # was the intent; projectionLagSeconds() was built for it, measured the
      # wrong thing, and was replaced in #35 by projectionIsCurrent(), which
      # reads two in-memory signals and never touches this table. The comment
      # is corrected rather than deleted, because a comment describing a
      # control that does not exist is how the next reader comes to trust a
      # number no code depends on -- which this repository has already lost a
      # mechanism to once.
      - name: Assert the consumer checkpoint cannot rewind on a replay
        run: node scripts/verify-checkpoint-monotonic.mjs

      # A message the consumer cannot use must be KEPT, not dropped.
      #
      # There were two ways to be unprocessable and only one left a trace. An
      # UNDECODABLE message was dead-lettered -- correct. A message that
      # decoded cleanly and carried no messageId, tenantId or eventId was
      # logged at ERROR and then simply RETURNED, while the caller went on to
      # commit the offset. The message was gone and the only evidence was a log
      # line nobody greps.
      #
      # Those are the same situation: permanently unprocessable, would block
      # the partition forever if retried, not the consumer's fault. The second
      # is the sharper one, because it cannot be recorded in ProcessedMessage
      # either -- that table is tenant-scoped under FORCE RLS and the whole
      # problem is the missing tenant. The dead-letter topic is the only place
      # it can go.
      #
      # eventId is a plain Avro string, so an EMPTY one is a perfectly valid
      # message on the wire. That is what makes this reachable rather than
      # theoretical. A genuinely undecodable payload is sent alongside it as a
      # positive control: if that did not reach the DLQ either, the test would
      # be measuring a broken producer rather than the consumer.
      #
      # Runs last among the Kafka assertions because it deliberately writes two
      # poison messages to events.activity.
      - name: Assert an unusable message is dead-lettered rather than dropped
        run: |
          # Needs the projection consumer actually running -- this assertion is
          # about what the consumer does with a message, not about the topic.
          #
          # Ticketing refuses to start without AUTH_PUBLIC_KEY_B64, and the first
          # version of this step did not export it. The service never came up,
          # and the verifier's positive control said so in the right words:
          # "the undecodable message did NOT reach the dead-letter topic -- the
          # consumer is not running ... so nothing below proves anything".
          # Without that control the run would have reported only the real
          # assertion failing and sent someone hunting in the consumer.
          AUTH_PUBLIC_KEY_B64=$(base64 -w0 services/auth/keys/public.pem)
          export AUTH_PUBLIC_KEY_B64

          (cd services/ticketing && \
            PORT=3003 \
            DATABASE_URL="$TICKETING_DATABASE_URL" \
            APP_DATABASE_URL="$TICKETING_APP_DATABASE_URL" \
            node dist/index.js &)

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3003/health >/dev/null; then break; fi
            sleep 1
          done

          node scripts/verify-dlq-malformed.mjs
          pkill -f "node dist/index.js" || true

      # Four places in this repository claim a consumer can rebuild its whole
      # projection by replaying events.activity from the beginning. Nothing
      # checked it, and that claim is the entire justification for
      # cleanup.policy=compact, for the payload being a full SNAPSHOT rather
      # than a delta, and for Ticketing having no bootstrap endpoint at all.
      #
      # The assertion that matters: for every key, the LAST message must also be
      # the HIGHEST-versioned one. Compaction keeps the last message per key and
      # deletes the rest, so a stale snapshot arriving last means the compactor
      # deletes the newer one — and a rebuild then reads the stale state, with
      # no version guard able to help because the newer message is gone.
      #
      # This is the direct check on what #61 fixed. The live projection stayed
      # correct throughout that bug, because its monotonic guard discarded the
      # late arrival; only a rebuild was wrong, and only after the compactor ran.
      #
      # Placed late: it needs both a populated topic and a populated projection.
      - name: Assert the topic can still rebuild the projection
        run: node scripts/verify-projection-rebuild.mjs

      # Drains TICKETING's outbox with the same relay binary.
      #
      # Added because the payment-path review found that the reservation handler
      # had been writing rows to tickets.reserved since it was built, while no
      # Avro schema was registered for that topic and nothing was draining that
      # table. Eight rows had accumulated; every one would have dead-lettered
      # the moment a relay was pointed at it. Nothing in CI noticed, because
      # nothing was looking at that topic.
      #
      # It also demonstrates why `topic` is a stored column: draining a second
      # service's outbox needs a different connection string and nothing else.
      - name: Drain Ticketing's outbox and decode the messages
        run: node scripts/verify-ticketing-relay.mjs

      # Two sweepers racing the same expired holds.
      #
      # Targets a failure the schema cannot catch: a DOUBLE INVENTORY RETURN
      # passes both TicketType CHECK constraints. Returning the same seats twice
      # keeps remaining + held + sold = total perfectly true — it just moves the
      # total in the wrong direction and oversells silently, because a constraint
      # only ever sees one row.
      #
      # Two things prevent it and this proves both: FOR UPDATE SKIP LOCKED in the
      # SAME transaction as the release, and `AND status = 'HELD'` on the
      # expiring UPDATE.
      - name: Assert two sweepers return each seat exactly once
        run: node scripts/verify-sweeper-concurrency.mjs

      # Runs LAST, after every other test has moved inventory around.
      #
      # The CHECK constraint already guarantees the arithmetic
      # (remaining + held + sold = total). This checks something the constraint
      # structurally cannot: that the counters match the RESERVATIONS EXPLAINING
      # THEM — held against HELD and PENDING_PAYMENT items, sold against
      # CONFIRMED ones. A constraint only ever sees one row, so it cannot notice
      # a counter that moved without a reservation to justify it.
      #
      # This is the single assertion worth running after any chaotic sequence,
      # and it is where a sweeper or payment bug will surface.
      - name: Assert inventory reconciles with its reservations
        run: node scripts/verify-inventory-reconciliation.mjs

      # The assertion that ties Chapter 4 together. Every piece is checked
      # separately above — the schema contract, the broker round-trip, the RLS
      # policies — but "does a row written by a service actually become a message
      # a consumer can read?" is only true if all of them hold at once.
      #
      # Writes an outbox row as the SERVICE role with tenant context, drains
      # once, then asserts the row is marked published AND the message decodes
      # from Kafka by resolving the writer's schema from the wire format.
      # Nothing pruned the outbox, in either database. The relay was granted
      # DELETE precisely so that something could -- the migration comment says
      # "DELETE is granted because nothing else can prune this table" -- and the
      # code was never written. The grant existed; the job did not.
      #
      # Kept forever, deliberately: rows still awaiting delivery, and
      # dead-lettered rows. The latter are the evidence of a payload that could
      # never encode, nothing in this repo clears deadLetteredAt, and they are
      # bounded by how many bad payloads exist rather than by traffic.
      #
      # THE ASSERTION THAT MATTERS is the last one. A prune that deletes nothing
      # looks exactly like a prune with nothing to do, and row-level security
      # makes that silent -- a policy that does not match the caller filters
      # rather than raises. Measured before any pruning existed: as the table
      # OWNER with no app.tenant_id, count(*) on ProcessedMessage returned 0 of
      # 29 real rows and a DELETE removed 0, exit code 0.
      #
      # So pruneOnce compares what it can SEE against what it can DELETE, in one
      # transaction. The test provokes BOTH failures: a missing grant, which
      # Postgres raises outright, and a policy narrowed to FOR SELECT, which is
      # silent and is the one the comparison exists to catch.
      # The other two tables that grow forever -- and unlike the outbox, NO ROLE
      # COULD prune these. Both carry a tenant_isolation policy with no TO
      # clause, so it applies to PUBLIC and FORCE row security binds even the
      # owner. Measured: as eventhub_ticketing_owner with no app.tenant_id,
      # count(*) on ProcessedMessage returned 0 of 29 real rows and a DELETE
      # removed 0, exit code 0.
      #
      # A retention sweep has no tenant, and there is no Tenant table here to
      # loop over, so the sweeper gets a role-targeted policy the way its other
      # cross-tenant work does. Its reach is bounded by GRANTS instead: DELETE
      # table-wide, but SELECT on only the two columns the job reads. It cannot
      # read IdempotencyKey.responseBody -- a cached customer response -- which
      # is asserted here, because that column-level grant is the thing keeping
      # the widening honest.
      #
      # Both failure modes are provoked: a missing grant, which Postgres raises
      # outright, and a policy narrowed to FOR SELECT, which is silent and is
      # what the SEEN-versus-DELETED comparison exists to catch.
      - name: Assert the bookkeeping tables age out on a credential that cannot read them
        run: node scripts/verify-bookkeeping-retention.mjs

      - name: Assert delivered outbox rows age out and a dead prune cannot lie
        run: node scripts/verify-outbox-retention.mjs

      # One aggregate's messages must reach Kafka in the order they were written,
      # even when a publish fails. They did not, and this workflow is what caught
      # it: on a fresh broker the relay published v3 at p1/0 then v1 at p1/8 for
      # one event.
      #
      # A transient failure sets nextAttemptAt to a backoff and leaves the row
      # unpublished; the claim skipped it and nothing stopped the SAME
      # aggregate's later rows going out ahead. Inside a single drain the publish
      # loop did the same thing one level down.
      #
      # events.activity is COMPACTED, so the last message per key is the one that
      # survives — a stale version arriving last becomes the event's permanent
      # value for anyone rebuilding from the beginning, which is the whole reason
      # the topic is compacted. The live projection stays correct because its
      # monotonic guard discards the late arrival, so nothing looks wrong until a
      # rebuild produces a projection made of stale snapshots.
      #
      # Drives the SHIPPED drain with a stub publisher, so a transient failure on
      # exactly one row is deterministic rather than something to provoke against
      # a real broker. Includes a clean positive control: without it, every
      # assertion here is satisfied by a relay that publishes nothing.
      - name: Assert one aggregate keeps its order across a failed publish
        env:
          EVENT_APP_DATABASE_URL: ${{ env.EVENT_APP_DATABASE_URL }}
          RELAY_DATABASE_URL: postgresql://eventhub_event_relay:eventhub_event_relay@localhost:5432/eventhub_event
        run: node scripts/verify-relay-ordering.mjs

      # A connection the database kills while it is CHECKED OUT must not kill
      # the process. It did: the relay exited 1 mid-drain on
      #
      #   error: terminating connection due to idle-in-transaction timeout
      #   Emitted 'error' event on Client instance
      #
      # which is the one error its role's idle_in_transaction_session_timeout
      # exists to produce. pg-pool forwards errors only from IDLE clients, and
      # pg's Client emits (rather than rejecting a query) only when no query is
      # in flight -- so "checked out, transaction open, idle" had no listener.
      # withClient() closes it in all three services that carry a pool helper.
      #
      # Forces the case with a per-session 1s timeout rather than waiting 30s.
      # Its negative control runs every time: a child process doing the
      # unguarded checkout must die of exactly that unhandled 'error'. Also
      # counts listeners across twelve checkouts of one Client, drives the
      # shipped drain through a termination mid-publish, and ratchets every
      # pool.connect() in services/ into a withClient.
      - name: Assert a connection terminated while checked out is not fatal
        env:
          EVENT_APP_DATABASE_URL: ${{ env.EVENT_APP_DATABASE_URL }}
          RELAY_DATABASE_URL: postgresql://eventhub_event_relay:eventhub_event_relay@localhost:5432/eventhub_event
        run: node scripts/verify-relay-idle-in-transaction.mjs

      - name: Verify outbox to Kafka end to end
        env:
          RELAY_DATABASE_URL: postgresql://eventhub_event_relay:eventhub_event_relay@localhost:5432/eventhub_event
        run: node scripts/verify-relay-e2e.mjs

      # occurredAt is the outbox row's createdAt, whatever zone the relay runs in.
      # It was not: pg parses the timestamp-without-time-zone column as LOCAL time
      # and the relay published toISOString() of that, so a relay pass on a UTC+8
      # host stamped every message eight hours early. This runner is UTC, where the
      # two agree, so the pass runs in a child with TZ=Asia/Kathmandu and asserts it
      # really ran at +05:45 -- without that, this step could never go red here.
      # Compared with Postgres's own rendering, as a string and in SQL.
      - name: Assert the relay publishes createdAt as occurredAt in any time zone
        env:
          EVENT_APP_DATABASE_URL: ${{ env.EVENT_APP_DATABASE_URL }}
          RELAY_DATABASE_URL: postgresql://eventhub_event_relay:eventhub_event_relay@localhost:5432/eventhub_event
        run: node scripts/verify-relay-occurred-at.mjs

      # Reads back everything on events.activity and asserts, on the WIRE, the
      # four properties the projection's safety rests on. This was a hand-run
      # demo script; nothing invoked it, and one of its checks could not fail.
      #
      # It printed "versions arrived in order: yes" for two chapters. The line
      # above it sorted the array IN PLACE to make the log readable, and the
      # check then asked whether a list sorted by version was in version order.
      # Handed 3, 1, 2 it still said yes.
      #
      # Its other two checks were scoped to the topic rather than to a KEY,
      # which is the only scope Kafka's ordering guarantee has. They were true
      # only because the topic held one event's updates when it was written, and
      # go red on any topic with several -- correct traffic reported as broken.
      #
      # The ordering check reads only what the RELAY published. Over the whole
      # topic it failed on the stale snapshots verify-search-indexer.mjs
      # publishes on purpose, red or green by whether the log cleaner had
      # compacted them yet -- run 35524988941 failed a Community-only PR on it.
      #
      # Placed after the relay e2e so there is real relayed traffic to read.
      - name: Assert the wire holds the properties the projection depends on
        run: node scripts/verify-events-activity.mjs

      # Proves the relay credential is least-privilege. It reads across EVERY
      # tenant (its policy is USING(true)), so it must not also be able to read
      # tenant data — and that failure is silent: an over-privileged relay works
      # perfectly and is simply far more dangerous if it leaks.
      - name: Assert the relay cannot read business tables
        run: |
          RELAY_URL="postgresql://eventhub_event_relay:eventhub_event_relay@localhost:5432/eventhub_event"

          # POSITIVE CONTROL FIRST. The refusal below passes whenever psql fails
          # for ANY reason -- a wrong password, a wrong port, a missing binary --
          # so on its own it would report "refused as intended" while proving
          # nothing. This is the third assertion of that shape found in this
          # repository, so the control is not optional.
          #
          # The relay MUST be able to read its outbox; that is its entire job.
          psql "$RELAY_URL" -tAc 'SELECT 1 FROM "OutboxMessage" LIMIT 1' >/dev/null 2>&1 || {
            echo "CONTROL FAILED: the relay credential cannot read its OWN outbox."
            echo "The connection is broken, so the refusal below would prove nothing."
            exit 1
          }
          echo "relay can read OutboxMessage, as it must"

          if psql "$RELAY_URL" -tAc 'SELECT 1 FROM "Event" LIMIT 1' 2>/dev/null; then
            echo "PRIVILEGE FAILURE: the relay role can read the Event table"
            exit 1
          fi
          echo "relay is refused SELECT on Event, as intended"

      # Tenant isolation is the load-bearing security property of this codebase,
      # so it is asserted on every pull request rather than trusted.
      - name: Assert RLS blocks the runtime role
        run: |
          COUNT=$(psql "$APP_DATABASE_URL" -tAc 'SELECT count(*) FROM "User";')
          test "$COUNT" = "0" || { echo "RLS FAILED: runtime role saw $COUNT users with no tenant context"; exit 1; }
          echo "runtime role sees 0 users without tenant context"

          # set_config must run in the SAME transaction as the query, because it
          # is LOCAL — so this is a multi-statement batch. psql echoes command
          # tags like BEGIN and COMMIT even under -tA, and set_config returns the
          # value it set, so the output has several lines and only one of them is
          # the count. Match the numeric line rather than assuming its position:
          # `tail -1` picked up COMMIT, which is what failed the first CI run.
          WITH_CTX=$(psql "$APP_DATABASE_URL" -tAc "BEGIN; SELECT set_config('app.tenant_id','tenant_acme',true); SELECT count(*) FROM \"User\"; COMMIT;" | grep -E '^[0-9]+$')
          test "$WITH_CTX" -ge "1" || { echo "expected users for tenant_acme, got '$WITH_CTX'"; exit 1; }
          echo "with tenant context it sees $WITH_CTX"

      # Every table must have RLS unless it is on the documented exemption list.
      # This is what stops a future migration silently shipping a table that is
      # readable across tenants — Prisma never emits RLS, so a forgotten policy
      # block is invisible in code review.
      #
      # Runs against BOTH databases. Each service has its own exemption list, and
      # exempting a table is therefore a decision someone writes down here rather
      # than an omission nobody notices.
      - name: Assert no table is missing RLS
        run: |
          check() {
            local url="$1" label="$2" exempt="$3"
            MISSING=$(psql "$url" -tAc "
              SELECT string_agg(relname, ', ')
              FROM pg_class
              WHERE relkind = 'r'
                AND relnamespace = 'public'::regnamespace
                AND NOT (relrowsecurity AND relforcerowsecurity)
                AND relname NOT IN ($exempt);
            ")
            test -z "$MISSING" || { echo "[$label] tables missing RLS: $MISSING"; exit 1; }
            echo "[$label] every non-exempt table has RLS enabled and forced"
          }

          # POSITIVE CONTROL. Without this the assertion above cannot fail.
          #
          # `test -z "$MISSING"` passes on an empty result, and a query that
          # matches NOTHING returns an empty result too. So a wrong relkind, a
          # wrong namespace filter, or a rename in pg_class would make every
          # database report "fully covered" while checking nothing at all.
          #
          # This repo has shipped that exact bug twice -- a relay boot assertion
          # that passed on "relation does not exist", and a codegen check that
          # confirmed broken output was current. An assertion that cannot fail is
          # worse than no assertion, because it reads as evidence.
          #
          # The control runs the same query with NO exemptions and requires it to
          # find something. It always can: _prisma_migrations is exempt in every
          # database precisely because it has no RLS, so a working query sees at
          # least one row here.
          control() {
            local url="$1" label="$2"
            FOUND=$(psql "$url" -tAc "
              SELECT count(*)
              FROM pg_class
              WHERE relkind = 'r'
                AND relnamespace = 'public'::regnamespace
                AND NOT (relrowsecurity AND relforcerowsecurity);
            ")
            test "$FOUND" -ge 1 || {
              echo "[$label] CONTROL FAILED: the coverage query found $FOUND tables without RLS."
              echo "[$label] It should see at least _prisma_migrations. The query is not looking at"
              echo "[$label] anything, so the check above proves nothing."
              exit 1
            }
            echo "[$label] control ok: the query can see $FOUND table(s) without RLS"
          }

          # Auth exemptions, each justified in its migration:
          #   Tenant       - read before tenant context exists, to resolve a slug
          #   RefreshToken - found by token hash; tenant is a result, not an input
          #   Invite       - same as RefreshToken
          #   PasswordResetToken - same as RefreshToken. A policy would filter out
          #                  the row that says which tenant to set, so the reset
          #                  would be impossible rather than merely restricted.
          control "$DATABASE_URL" auth
          check "$DATABASE_URL" auth "'_prisma_migrations','Tenant','RefreshToken','Invite','PasswordResetToken'"

          # Event has no exemptions. Every table is tenant-scoped, including
          # OutboxMessage, which carries a second role-targeted policy for the
          # relay rather than being exempt.
          control "$EVENT_DATABASE_URL" event
          check "$EVENT_DATABASE_URL" event "'_prisma_migrations'"

          # Ticketing has NO exemptions. Nothing here is looked up before tenant
          # context exists: every request carries a verified JWT, and the
          # consumer reads tenantId off the message before writing.
          control "$TICKETING_DATABASE_URL" ticketing
          check "$TICKETING_DATABASE_URL" ticketing "'_prisma_migrations'"

          # Live has NO exemptions. Question and QuestionVote are both
          # tenant-scoped, and the socket carries a verified tenant claim for its
          # whole life -- there is nothing here that is read before tenant
          # context exists.
          control "$LIVE_DATABASE_URL" live
          check "$LIVE_DATABASE_URL" live "'_prisma_migrations'"

          # Notification has NO exemptions, though the Field Guide exempted its
          # sent-log. The claim is made while handling a message, and every
          # message carries its tenant, so tenant context is set before it --
          # the reason is written out in the RLS migration.
          control "$NOTIFICATION_DATABASE_URL" notification
          check "$NOTIFICATION_DATABASE_URL" notification "'_prisma_migrations'"

          # Community has NO exemptions either. Every table here belongs to a tenant,
          # including the audit trail and the outbox, which carries the relay's own
          # policy rather than an exemption.
          control "$COMMUNITY_DATABASE_URL" community
          check "$COMMUNITY_DATABASE_URL" community "'_prisma_migrations'"

      # Database-per-service must hold at the CONNECTION boundary, not merely at
      # the table grants: a credential that can open a session can still
      # enumerate another service's schema from pg_catalog.
      #
      # DERIVED, NOT LISTED. This step used to spell out every direction by
      # hand, and its positive control had stopped at three services while a
      # fourth database existed. The verifier reads the databases, their CONNECT
      # grants and every login role from db/init, connects each database's own
      # roles first through the same code path, then requires every other role
      # to be refused with 42501 -- not merely to fail, which a wrong port does.
      - name: Assert services cannot connect to each other's databases
        run: |
          node scripts/verify-database-isolation.mjs

          # A second control, on the ENV VAR rather than the verifier's own
          # connections.
          #
          # The verifier proves the connections it builds are right. This proves
          # the environment variable every other step uses is right too -- they
          # are different failures, and only this one would catch a bad
          # TICKETING_APP_DATABASE_URL.
          psql "$TICKETING_APP_DATABASE_URL" -tAc 'SELECT 1' >/dev/null \
            || { echo "TICKETING_APP_DATABASE_URL does not reach its own database"; exit 1; }
          echo "  connected via TICKETING_APP_DATABASE_URL"

      # The other half of what db/init settles per role: the relays and sweepers
      # are given idle_in_transaction_session_timeout and statement_timeout, and
      # until now nothing asserted they arrive. services/relay/src/db.ts names
      # them in the comment on its pool -- an open transaction pins xmin and
      # blocks VACUUM across the WHOLE cluster, so a relay that hangs mid-batch
      # degrades every database, and the timeout is what ends it.
      #
      # Its failure is silent and slow. A role dropped and recreated by a later
      # migration loses the ALTER ROLE with nothing raised, every test stays
      # green, and the symptom is table bloat somewhere else, weeks later.
      #
      # DERIVED, NOT LISTED, like the step above: the roles, the settings and
      # the values are read out of db/init, so a seventh role given a timeout is
      # covered the moment it is bootstrapped. Checked on the role in
      # pg_db_role_setting AND in a session opened as that role, because the
      # catalog row and a backend actually starting with the value are different
      # claims -- and against a role the file does not alter, so 15s cannot be
      # read back from a cluster default and mistaken for the setting.
      - name: Assert the relay and sweeper roles carry their timeouts
        run: node scripts/verify-role-timeouts.mjs

      # The sent-log's claim and its row-level security, checked against the
      # table. The coverage step above proves the flags are set; this proves the
      # policy does what the flags promise, and that concurrent claims of one key
      # produce one row.
      - name: Assert the notification sent-log claims once per tenant, under RLS
        run: node scripts/verify-notification-sentlog.mjs

  # ===========================================================================
  # The README's headline claim, asserted.
  # ===========================================================================
  #
  # "docker compose up -d --wait and the whole system is running" is the first
  # thing the README promises and was the one claim nothing checked. The `build`
  # job above deliberately does not: it runs the services natively from the
  # working tree, so it never builds the image and never starts the application
  # containers.
  #
  # Which means the Dockerfile, the setup container and the compose wiring could
  # all break without a single red build, and the failure would land on whoever
  # cloned the repository to look at it. A separate job, in parallel, so it costs
  # wall-clock time rather than blocking anything.
  compose:
    name: the one-command start actually starts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # THE SAME DISK FIX AS THE build JOB, which this job never had.
      #
      # This job builds the application image and pulls every infrastructure
      # image onto a runner that still carries the preinstalled SDKs. A run on
      # #120 measured the root filesystem at 83% before `compose up`, and the
      # `setup` container then died in bootstrap:index with
      #   index_create_block_exception: blocked by: [FORBIDDEN/10/cluster
      #   create-index blocked (api)]
      # — OpenSearch's 90% high watermark, the exact error the build job's step
      # below was written for. The same commit's compose job had passed an hour
      # earlier, so it was variance whether the build crossed the line; every PR
      # that adds an image or a service makes crossing it more likely.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /

      # The whole file this time, not a named subset. --wait returns only when
      # every container is HEALTHY, so this step passing is already the claim:
      # a non-zero exit means the one-command start does not work.
      - name: docker compose up -d --wait
        run: docker compose up -d --wait --wait-timeout 600

      # Measured after the build, because the build is what fills the disk. If
      # this job ever starts failing on OpenSearch again, this line says how
      # close it came rather than leaving it to be rediscovered from a 403.
      - name: Report disk after the stack is up
        if: always()
        run: df -h /

      - name: Show what came up
        if: always()
        run: docker compose ps

      # .dockerignore says a secret must never be in a layer. That was a claim
      # about a file, not about the image -- and the image disagreed: the relay
      # carries a `.env.ticketing` so one binary can be pointed at the other
      # service's outbox, `**/.env` matches only the exact name `.env`, and the
      # file went in with RELAY_DATABASE_URL and its credentials. .gitignore
      # covers it, so it never reached a commit and nothing ever looked.
      #
      # Asserted against the BUILT IMAGE rather than by re-reading the ignore
      # rules, because re-reading the rules is what missed it. This runs here
      # because this is the only job that builds the image at all.
      - name: Assert the image carries no secrets
        run: |
          set -euo pipefail

          found=$(docker run --rm --entrypoint sh eventhub/app:local -c '
            find /app -name ".env*" -not -name "*.example" -not -path "*/node_modules/*"
            find /app \( -name "*.pem" -o -name "*.key" -o -name "id_rsa*" \) -not -path "*/node_modules/*"
            ls -d /app/.git 2>/dev/null || true
          ')

          if [ -n "$found" ]; then
            echo "these are inside the image and must not be:"
            echo "$found"
            echo ""
            echo "A real .env, key material or the git history in a layer travels with"
            echo "every copy of the image. Add the shape to .dockerignore -- and note that"
            echo "**/.env does NOT match .env.something."
            exit 1
          fi

          # The control: the committed examples SHOULD be there, so a pass means
          # the check can see files at all rather than that find matched nothing
          # because the path was wrong.
          examples=$(docker run --rm --entrypoint sh eventhub/app:local -c \
            'find /app -name ".env.example" -not -path "*/node_modules/*" | wc -l')
          test "$examples" -ge 4 \
            || { echo "only $examples .env.example files in the image — this check is looking at the wrong place"; exit 1; }
          echo "  no secrets, and $examples committed examples present"

      # A private key is readable only where it belongs. Every verifying service
      # used to mount the whole jwt-keys volume, private.pem included, and they all
      # run as the user that owns it -- so any of them could mint an admin token.
      # Asserted from inside each running container, not from the compose file.
      - name: Assert only Auth can read Auth's private key
        run: node scripts/verify-key-custody.mjs

      # Healthy is not the same as working. Every assertion below crosses a
      # container boundary that a healthcheck cannot see.
      - name: Prove it works end to end
        run: |
          set -euo pipefail

          # Through the gateway, as a reader would: the tenant is the subdomain.
          # curl resolves any *.localhost name to loopback by itself.
          GATEWAY=http://acme.eventhub.localhost:8000

          # Auth signs with the private key the setup container generated into a
          # volume. If that volume wiring were wrong, auth would not have started.
          # And it knows the tenant only from the slug Kong took from the Host.
          TOKEN=$(curl -sf -X POST "$GATEWAY/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"alice@acme.com","password":"hunter2222"}' \
            | grep -o '"accessToken":"[^"]*"' | cut -d'"' -f4)
          test -n "$TOKEN" || { echo "no token: the seed, the signing key or the gateway's tenant did not survive setup"; exit 1; }
          echo "  signed in as the seeded admin, through the gateway"

          # THE CROSS-SERVICE ASSERTION. Event holds no private key; it verifies
          # this token with the PUBLIC half, read from the jwt-public volume via
          # AUTH_PUBLIC_KEY_FILE. A 201 here is the only proof that path works,
          # and it is a path the native CI job never takes -- it passes the key as
          # a base64 environment value instead.
          CREATED=$(curl -sf -X POST "$GATEWAY/events" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"title":"Compose CI","capacity":42,"startsAt":"2027-11-01T10:00:00Z","endsAt":"2027-11-01T18:00:00Z"}')
          echo "  Event accepted a token it can verify but cannot mint"

          # AND THE ASYNCHRONOUS PATH. Event wrote an outbox row; the relay has to
          # claim it, resolve its Avro schema from the registry, and publish to
          # Kafka; Ticketing's consumer has to project it. Polled, because none of
          # that is synchronous with the request above.
          for i in $(seq 1 30); do
            FOUND=$(docker exec eventhub-postgres psql -U eventhub -d eventhub_ticketing -tAc \
              "SELECT count(*) FROM \"EventProjection\" WHERE title = 'Compose CI'")
            if [ "$FOUND" = "1" ]; then
              echo "  Ticketing projected it after ${i}s — outbox, relay, Avro, Kafka and consumer all worked"
              exit 0
            fi
            sleep 1
          done

          echo "the event never reached Ticketing's projection."
          echo "Event wrote it, so the break is in the relay, the registry or the consumer:"
          docker compose logs relay ticketing --tail 60
          exit 1

      # The notification chain, in the containers rather than natively. Every other
      # email verifier runs the services from the working tree, with keys from it and
      # a fake SMTP server, so none of them touches what this does: Auth sealing with
      # the keypair the setup container generated, Notification opening it with the
      # private half from the notification-keys volume that only it mounts, relay-auth
      # draining Auth's outbox inside the network, and Mailpit receiving the mail.
      #
      # It adds its own user to the seeded tenant and takes it away again, because a
      # verifier that resets a seeded account's password leaves the README's own
      # sign-in example broken for the next reader.
      - name: Prove a password reset crosses the whole stack
        run: node scripts/verify-compose-password-reset.mjs

      # Every other sweeper verifier starts a sweeper of its own with --once, so
      # none of them could notice that nothing in the stack ran one -- and nothing
      # did: Ticketing's container never imported it, and a lapsed hold kept its
      # seats for good. This one lets a hold lapse in the running containers and
      # starts nothing; the stack has to give the seats back by itself.
      - name: Prove the stack returns an expired seat hold
        run: node scripts/verify-compose-hold-sweeper.mjs

      # The reconciler had the same gap, and every reconciler verifier in the build
      # job runs one of its own, so none could see it: compose never started one,
      # and a charge the provider never answered stayed UNKNOWN with its seats held
      # for good. This one pays through the gateway with two amounts the fake
      # provider does not answer and starts nothing; the stack has to confirm one
      # and return the other to a hold, after the API has stopped waiting, and the
      # reconciler container's own log has to name both. It waits out compose's
      # 20 s grace, so it takes about half a minute.
      - name: Prove the stack settles a charge the provider never answered
        run: node scripts/verify-compose-payment-reconciler.mjs

      # Chapter 9's end-to-end smoke, in the containers. Auth's token is verified by
      # Community with the jwt-public volume's key; relay-community publishes this
      # run's three outbox rows; Community's own consumer, on the real group, fans the
      # posts out; and the reader pages the feed with its cursor. The fan-out is
      # asserted on the FeedEntry rows and the posts' flag, because the feed alone
      # serves unfanned posts too and would look the same with Kafka broken.
      - name: Prove Community works across the whole stack
        run: node scripts/verify-compose-community.mjs

      # The gateway, as the stack runs it. Every route reaches the service its table
      # says, a client-sent tenant header never arrives upstream, the tenant is the
      # Host's subdomain or the request is refused, and the admin API is not on the
      # network. The upstream half runs a scratch Kong with this config pointed at an
      # echo server, because no service reports the headers it was given.
      - name: Prove the gateway routes, and no client can name its tenant
        run: node scripts/verify-compose-gateway.mjs

      # What the gateway does to every request besides routing it: a request id the
      # service also receives, CORS for the tenants' own origins only, a 1 MB body
      # ceiling, and an access log with no Authorization, cookie or query string in
      # it. The rate limit is asserted by its effect: the running node's count rises
      # in Redis, and two scratch nodes on one Redis database share a single count of
      # four, which the same node on another database does not. Token signatures are
      # checked at the edge with Auth's own key: an expired or wrong-issuer token signed
      # with that real key is refused by Kong, not by the service. Waits for a fresh
      # minute, so it takes up to one.
      - name: Prove the gateway's request ids, CORS, signatures, limits and logs
        run: node scripts/verify-compose-gateway-edge.mjs

      # Re-running must be safe, because a reader will do it. The keypair
      # specifically: regenerating it would invalidate every token already
      # issued, and the symptom is a 401 with no explanation.
      - name: And running it again changes nothing
        run: |
          set -euo pipefail
          BEFORE=$(docker compose exec -T auth sha256sum keys/public.pem | cut -d' ' -f1)
          docker compose up -d --wait --wait-timeout 600
          AFTER=$(docker compose exec -T auth sha256sum keys/public.pem | cut -d' ' -f1)
          test "$BEFORE" = "$AFTER" \
            || { echo "the signing keypair was rotated by a second up; every issued token just died"; exit 1; }
          echo "  the keypair survived a second up ($BEFORE)"

          curl -sf http://localhost:3001/health >/dev/null
          curl -sf http://localhost:3002/health >/dev/null
          curl -sf http://localhost:3003/health >/dev/null
          curl -sf http://localhost:3010/metrics >/dev/null
          curl -sf http://localhost:3011/metrics >/dev/null
          curl -sf http://localhost:3012/metrics >/dev/null
          echo "  all six services still answering"

      - name: Logs
        if: failure()
        run: docker compose logs --tail 120
